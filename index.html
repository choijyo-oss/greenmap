<script type="module">
import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
import * as Lucide from 'lucide-react';
import Chart from 'chart.js/auto';
import JSZip from 'jszip';

const html = htm.bind(React.createElement);

// ===================== LOGIC-START =====================
const APP = 'AirSense Analytics';
const GAP_MS = 10 * 60 * 1000; // 10분 이상 끊기면 다른 측정 회차로 분리
const METRICS = ['co2', 'temp', 'hum'];
const META = {
  co2: { label: 'CO₂', name: '이산화탄소', unit: 'ppm', du: 'ppm', color: '#34d399', d: 0 },
  temp: { label: '온도', name: '온도', unit: '°C', du: '°C', color: '#fbbf24', d: 1 },
  hum: { label: '습도', name: '상대습도', unit: '%', du: '%p', color: '#22d3ee', d: 1 },
};
const PALETTE = ['#34d399', '#22d3ee', '#a78bfa', '#fbbf24', '#f472b6', '#60a5fa', '#fb7185', '#a3e635', '#fb923c', '#2dd4bf'];

const uid = () => globalThis.crypto?.randomUUID?.() ?? (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const finite = (xs) => xs.filter((x) => typeof x === 'number' && Number.isFinite(x));
const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : NaN);
const std = (xs) => {
  if (xs.length < 2) return 0;
  const m = mean(xs);
  return Math.sqrt(xs.reduce((s, x) => s + (x - m) ** 2, 0) / (xs.length - 1));
};
const quantile = (sorted, q) => {
  if (!sorted.length) return NaN;
  const pos = (sorted.length - 1) * q;
  const lo = Math.floor(pos);
  const hi = Math.ceil(pos);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
};
function pearson(xs, ys) {
  const n = Math.min(xs.length, ys.length);
  if (n < 3) return NaN;
  const mx = mean(xs.slice(0, n));
  const my = mean(ys.slice(0, n));
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - mx;
    const dy = ys[i] - my;
    sxy += dx * dy;
    sxx += dx * dx;
    syy += dy * dy;
  }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : NaN;
}
function linreg(xs, ys) {
  const mx = mean(xs);
  const my = mean(ys);
  let sxy = 0, sxx = 0;
  xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
  const slope = sxx ? sxy / sxx : 0;
  return { slope, intercept: my - slope * mx };
}
const fmt = (v, d = 1) => (typeof v === 'number' && Number.isFinite(v) ? v.toFixed(d) : '-');
const signed = (v, d = 1) => (Number.isFinite(v) ? `${v > 0 ? '+' : ''}${v.toFixed(d)}` : '-');
const round = (v, d = 1) => (typeof v === 'number' && Number.isFinite(v) ? Number(v.toFixed(d)) : null);
const groupBy = (xs, key) => {
  const m = new Map();
  for (const x of xs) {
    const k = key(x);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(x);
  }
  return m;
};
const pad2 = (n) => String(n).padStart(2, '0');
const isoDate = (t) => {
  const d = new Date(t);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
};
const hhmm = (t) => {
  const d = new Date(t);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};
const mmss = (s) => {
  const v = Math.max(0, Math.round(Number(s)));
  return `${Math.floor(v / 60)}:${pad2(v % 60)}`;
};
const koDate = (iso) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  return m ? `${Number(m[2])}월 ${Number(m[3])}일` : String(iso || '-');
};
const fmtDT = (t) => `${koDate(isoDate(t))} ${hhmm(t)}`;
const byKo = (a, b) => String(a).localeCompare(String(b), 'ko', { numeric: true });
const josa = (w, a, b) => {
  const c = String(w).trim().slice(-1).charCodeAt(0);
  if (c >= 0xac00 && c <= 0xd7a3) return w + ((c - 0xac00) % 28 ? a : b);
  return `${w}${a}(${b})`;
};
const corrWord = (r) => {
  if (!Number.isFinite(r)) return '판단 불가';
  const a = Math.abs(r);
  const s = a >= 0.7 ? '강한' : a >= 0.4 ? '뚜렷한' : a >= 0.2 ? '약한' : '거의 없는';
  return a < 0.2 ? '상관관계가 거의 없음' : `${s} ${r < 0 ? '음' : '양'}의 상관관계`;
};

/* ---------------- 파일 파싱 ---------------- */
function decodeText(buf) {
  const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(u8).replace(/^\uFEFF/, '');
  } catch {
    return new TextDecoder('euc-kr').decode(u8);
  }
}
const baseName = (p) => String(p).split('/').pop().replace(/\.[^.]+$/, '');

function splitCSV(text) {
  const head = text.split(/\r?\n/).slice(0, 10).join('\n');
  const delim = [',', '\t', ';']
    .map((d) => [d, head.split(d).length])
    .sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [];
  let cell = '';
  let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; } else q = false;
      } else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell);
      rows.push(row);
      row = [];
      cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => String(c).trim() !== ''));
}

const COLS = [
  ['co2', /co\s*2|co₂|이산화\s*탄소|carbon/i],
  ['temp', /temp|온도|기온|℃|°\s*c/i],
  ['hum', /hum|습도|\brh\b/i],
  ['loc', /장소|지역|위치|지점|location|place|site/i],
  ['date', /^\s*(date|날짜|일자|측정일)\s*$/i],
  ['time', /time|date|timestamp|일시|시간|시각|날짜|일자|경과/i],
];
const detectCol = (h) => {
  const s = String(h ?? '').trim();
  const f = COLS.find(([, re]) => re.test(s));
  return f ? f[0] : null;
};

function parseNumber(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  const s = String(v).trim().replace(/,/g, '');
  if (!s || /^(na|nan|null|none|-|err|error)$/i.test(s)) return null;
  const n = Number.parseFloat(s.replace(/[^\d.eE+-]/g, ''));
  return Number.isFinite(n) ? n : null;
}

function parseTimestamp(raw, baseDate) {
  const s = String(raw ?? '').trim();
  if (!s) return null;
  const base = baseDate || isoDate(Date.now());
  if (/^\d{10}(\d{3})?$/.test(s)) return s.length === 10 ? Number(s) * 1000 : Number(s);
  if (/^\d+(\.\d+)?$/.test(s) && Number(s) < 100000) {
    // 경과 시간(초) 열
    return new Date(`${base}T12:00:00`).getTime() + Number(s) * 1000;
  }
  const dm = s.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  const tm = s.match(/(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?(?:[.,]\d+)?\s*(AM|PM)?/i);
  if (!dm && !tm) {
    const p = Date.parse(s);
    return Number.isNaN(p) ? null : p;
  }
  let y, mo, d;
  if (dm) { y = +dm[1]; mo = +dm[2]; d = +dm[3]; } else { [y, mo, d] = base.split('-').map(Number); }
  let h = 0, mi = 0, sec = 0;
  if (tm) {
    h = +tm[2]; mi = +tm[3]; sec = tm[4] ? +tm[4] : 0;
    const ap = (tm[1] || tm[5] || '').toUpperCase();
    if ((ap === '오후' || ap === 'PM') && h < 12) h += 12;
    if ((ap === '오전' || ap === 'AM') && h === 12) h = 0;
  }
  const t = new Date(y, mo - 1, d, h, mi, sec).getTime();
  return Number.isNaN(t) ? null : t;
}

function dateFromName(name) {
  let m = String(name).match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = String(name).match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if (m) return `${new Date().getFullYear()}-${pad2(+m[1])}-${pad2(+m[2])}`;
  return null;
}

const DEFAULT_NAMING = { stripNames: [] };
const mergeNaming = (n) => ({
  ...DEFAULT_NAMING,
  ...(n || {}),
  stripNames: Array.isArray(n?.stripNames) ? [...new Set(n.stripNames.map((x) => String(x).normalize('NFC').trim()).filter(Boolean))] : [],
});
const escRe = (x) => String(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const SEP = '[\\s_\\-.,·()\\[\\]]';

function stripPersonNames(loc, names) {
  let out = String(loc || '').normalize('NFC');
  for (const n of names || []) {
    const nm = String(n).normalize('NFC').trim();
    if (!nm) continue;
    out = out.replace(new RegExp(`(^|${SEP})${escRe(nm)}(?=${SEP}|$)`, 'g'), ' ');
  }
  return out.replace(/^[\s_\-().[\],·]+|[\s_\-().[\],·]+$/g, '').replace(/\s+/g, ' ').trim();
}
function parseFileName(fileName, naming) {
  let name = baseName(String(fileName).normalize('NFC').replace(/\\/g, '/')).trim();
  let date = null;
  const dm = name.match(/(20\d{2})[-_.\s]?(\d{1,2})[-_.\s]?(\d{1,2})(?!\d)/);
  if (dm && +dm[2] >= 1 && +dm[2] <= 12 && +dm[3] >= 1 && +dm[3] <= 31) {
    date = `${dm[1]}-${pad2(+dm[2])}-${pad2(+dm[3])}`;
    name = name.replace(dm[0], ' ');
  } else {
    const km = name.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if (km) { date = `${new Date().getFullYear()}-${pad2(+km[1])}-${pad2(+km[2])}`; name = name.replace(km[0], ' '); }
  }
  let round = null;
  let location = name;
  const rm = name.match(/^(.*?)[\s_\-()[\]]*(\d+)\s*(일차|주차|회차|차시|차|회)(?![가-힣])/)
    || name.match(/^(.*?)[\s_\-()[\]]*(?:day|round|trial|run)\s*[-_]?\s*(\d+)/i);
  if (rm && rm[1].trim()) { location = rm[1]; round = Number(rm[2]); }
  else location = name.replace(/[_\-\s]+\d{1,2}$/, ' ');
  location = stripPersonNames(location.replace(/[()[\]]/g, ' ').replace(/_/g, ' '), naming?.stripNames);
  return { location: location || '미분류', round, date };
}
function locationFromName(name, naming) {
  return parseFileName(name, naming).location;
}
const INDOOR_RE = /교실|실내|강당|도서관|급식실|복도|체육관|사무실|거실|방$|집|실험실|과학실/;
const guessEnv = (loc) => (INDOOR_RE.test(loc) ? 'indoor' : null);

function makeSession(location, recs, fileName, timeGuessed, suffix) {
  return {
    id: uid(),
    location,
    date: isoDate(recs[0].t),
    label: baseName(fileName) + (suffix || ''),
    sourceFile: fileName,
    originName: '',
    timeGuessed,
    createdAt: Date.now(),
    raw: recs.map(({ t, co2, temp, hum }) => ({ t, co2, temp, hum })),
  };
}

const MAGNITUDE_COLS = [1, 2, 3]; // B, C, D (0 = A열)
const COL_LETTER = (i) => String.fromCharCode(65 + i);

function strictNumber(v) {
  const t = String(v ?? '').trim().replace(/,/g, '').replace(/\s*(ppm|%\s*rh|%|℃|°\s*c|c)$/i, '');
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? Number(t) : null;
}
function medianOf(xs) {
  const a = [...xs].sort((x, y) => x - y);
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

function magnitudeColumns(rows, startRow) {
  const data = rows.slice(startRow).filter((r) => r.length > Math.max(...MAGNITUDE_COLS));
  if (data.length < 3) return null;
  const cols = MAGNITUDE_COLS.map((ci) => ({ ci, vals: data.map((r) => strictNumber(r[ci])).filter((v) => v !== null) }));
  if (cols.some((c) => c.vals.length < Math.max(3, data.length * 0.6))) return null;
  const ranked = cols.map((c) => ({ ci: c.ci, med: medianOf(c.vals) })).sort((a, b) => b.med - a.med);
  if (ranked[0].med === ranked[1].med || ranked[1].med === ranked[2].med) return null;
  return {
    co2: ranked[0].ci, hum: ranked[1].ci, temp: ranked[2].ci,
    text: `${COL_LETTER(ranked[0].ci)}열=CO₂ · ${COL_LETTER(ranked[1].ci)}열=습도 · ${COL_LETTER(ranked[2].ci)}열=온도`,
  };
}
const looksLikeTime = (v) => /\d{1,2}:\d{2}|\d{4}\s*[-./년]\s*\d{1,2}/.test(String(v ?? ''));

function csvToSessions(text, fileName, locHint, opts = {}) {
  const rows = splitCSV(text);
  let hi = rows.slice(0, 30).findIndex((r) => {
    const k = r.map(detectCol);
    return k.includes('co2') || k.includes('temp') || k.includes('hum');
  });
  if (hi < 0) {
    const first = rows.slice(0, 30).findIndex((r) => MAGNITUDE_COLS.every((ci) => strictNumber(r[ci]) !== null));
    if (first < 0) throw new Error(`${fileName}: CO₂·온도·습도 열을 찾지 못했습니다. (헤더가 없고 B·C·D 열도 숫자가 아님)`);
    hi = first - 1;
  }
  const idx = {};
  if (hi >= 0) {
    rows[hi].forEach((h, i) => {
      const k = detectCol(h);
      if (k && idx[k] === undefined) idx[k] = i;
    });
  }
  let colRule = '';
  const reserved = [idx.time, idx.date, idx.loc].filter((v) => v !== undefined);
  if (!MAGNITUDE_COLS.some((ci) => reserved.includes(ci))) {
    const mag = magnitudeColumns(rows, hi + 1);
    if (mag) {
      idx.co2 = mag.co2; idx.hum = mag.hum; idx.temp = mag.temp;
      colRule = mag.text;
    }
  }
  if (idx.time === undefined && idx.date === undefined && ![idx.co2, idx.hum, idx.temp].includes(0)) {
    const sample = rows.slice(hi + 1, hi + 6).map((r) => r[0]);
    if (sample.length && sample.every(looksLikeTime)) idx.time = 0;
  }
  if (idx.co2 === undefined && idx.temp === undefined && idx.hum === undefined) {
    throw new Error(`${fileName}: CO₂·온도·습도 열을 찾지 못했습니다.`);
  }

  const nameDate = dateFromName(baseName(fileName)) || opts.dateHint || null;
  const val = (r, k) => (idx[k] === undefined ? null : parseNumber(r[idx[k]]));
  const recs = [];
  for (const r of rows.slice(hi + 1)) {
    let t = null;
    if (idx.time !== undefined || idx.date !== undefined) {
      const s = [idx.date !== undefined ? r[idx.date] : '', idx.time !== undefined ? r[idx.time] : ''].join(' ').trim();
      t = parseTimestamp(s, nameDate);
    }
    const rec = { t, co2: val(r, 'co2'), temp: val(r, 'temp'), hum: val(r, 'hum'), loc: idx.loc !== undefined ? stripPersonNames(String(r[idx.loc] ?? '').trim(), opts.naming?.stripNames) : '' };
    if (rec.co2 === null && rec.temp === null && rec.hum === null) continue;
    recs.push(rec);
  }
  if (!recs.length) throw new Error(`${fileName}: 유효한 측정 행이 없습니다.`);
  const timeGuessed = !recs.some((r) => r.t !== null);
  if (timeGuessed) {
    const base = new Date(`${nameDate || isoDate(Date.now())}T12:00:00`).getTime();
    const step = recs.length > 1 ? 60000 / (recs.length - 1) : 1000;
    recs.forEach((r, i) => { r.t = base + Math.round(i * step); });
  }
  const valid = recs.filter((r) => r.t !== null);
  const out = [];
  for (const [loc, list] of groupBy(valid, (r) => r.loc || locHint)) {
    list.sort((a, b) => a.t - b.t);
    const chunks = [[list[0]]];
    for (let i = 1; i < list.length; i++) {
      if (list[i].t - list[i - 1].t > GAP_MS) chunks.push([]);
      chunks[chunks.length - 1].push(list[i]);
    }
    chunks.forEach((c) => out.push(makeSession(loc, c, fileName, timeGuessed, chunks.length > 1 ? ` (${hhmm(c[0].t)})` : '')));
  }
  if (colRule) out.forEach((ss) => { ss.colRule = colRule; });
  return out;
}

function recordsFromObjects(rows) {
  const objs = rows.filter((r) => r && typeof r === 'object' && !Array.isArray(r));
  if (!objs.length) return [];
  const keys = Object.keys(objs[0]);
  const find = (k) => keys.find((key) => detectCol(key) === k);
  const tk = find('time') || find('date') || keys.find((k) => k === 't');
  const ck = find('co2'), ek = find('temp'), hk = find('hum'), lk = find('loc');
  return objs.flatMap((r) => {
    const rt = tk ? r[tk] : undefined;
    let t = null;
    if (typeof rt === 'number') t = rt < 1e11 ? rt * 1000 : rt;
    else if (typeof rt === 'string') t = parseTimestamp(rt);
    if (t === null) return [];
    return [{ t, co2: ck ? parseNumber(r[ck]) : null, temp: ek ? parseNumber(r[ek]) : null, hum: hk ? parseNumber(r[hk]) : null, loc: lk ? String(r[lk] ?? '') : '' }];
  });
}

const nOrNull = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : null);
function normalizeSessions(list) {
  return (Array.isArray(list) ? list : [])
    .map((s) => {
      const raw = (s.raw || []).map((r) => ({ t: Number(r.t), co2: nOrNull(r.co2), temp: nOrNull(r.temp), hum: nOrNull(r.hum) })).filter((r) => Number.isFinite(r.t));
      return {
        id: s.id || uid(),
        location: String(s.location || '미분류'),
        date: s.date || (raw[0] ? isoDate(raw[0].t) : isoDate(Date.now())),
        label: s.label || '',
        sourceFile: s.sourceFile || '',
        originName: s.originName || '',
        timeGuessed: !!s.timeGuessed,
        colRule: s.colRule || '',
        createdAt: s.createdAt || Date.now(),
        raw,
      };
    })
    .filter((s) => s.raw.length);
}

/* ---------------- 정제 ---------------- */
const DEFAULT_CLEANING = {
  enabled: true,
  removeDuplicates: true,
  duplicateStrategy: 'mean',
  interpolate: true,
  maxGap: 10,
  filterMalfunction: true,
  ranges: { co2: { min: 300, max: 5000 }, temp: { min: -20, max: 50 }, hum: { min: 0, max: 100 } },
  removeShort: true,
  minDuration: 20,
  splitGap: 5,
};
const mergeCleaning = (c) => ({ ...DEFAULT_CLEANING, ...c, ranges: { ...DEFAULT_CLEANING.ranges, ...(c?.ranges || {}) } });

function cleanRecords(raw, o) {
  const rep = { input: raw.length, dup: 0, out: 0, interp: 0, short: 0, shortSeg: 0, output: raw.length };
  if (!o.enabled) return { records: raw.map((r) => ({ ...r })), rep };
  let rows = [...raw].sort((a, b) => a.t - b.t).map((r) => ({ ...r }));
  if (o.filterMalfunction) {
    for (const r of rows) {
      for (const k of METRICS) {
        const v = r[k];
        if (v !== null && (v < o.ranges[k].min || v > o.ranges[k].max)) { r[k] = null; rep.out++; }
      }
    }
  }
  if (o.removeDuplicates) {
    const groups = [];
    for (const r of rows) {
      const g = groups[groups.length - 1];
      if (g && Math.round(g[0].t / 1000) === Math.round(r.t / 1000)) g.push(r);
      else groups.push([r]);
    }
    rows = groups.map((g) => {
      if (g.length === 1) return g[0];
      rep.dup += g.length - 1;
      if (o.duplicateStrategy === 'first') return g[0];
      const m = { ...g[0] };
      for (const k of METRICS) {
        const vs = finite(g.map((x) => x[k]));
        m[k] = vs.length ? mean(vs) : null;
      }
      return m;
    });
  }
  if (o.removeShort && rows.length) {
    const before = rows.length;
    rows = rows.filter((r) => r.co2 !== null || r.temp !== null || r.hum !== null);
    const kept = removeShortSegments(rows, o.minDuration, o.splitGap);
    rep.short = before - kept.rows.length;
    rep.shortSeg = kept.removedSegments;
    rows = kept.rows;
  }
  if (o.interpolate && rows.length > 2) {
    const diffs = rows.slice(1).map((r, i) => r.t - rows[i].t).filter((d) => d > 0).sort((a, b) => a - b);
    const dt = quantile(diffs, 0.5);
    if (dt > 0) {
      const filled = [rows[0]];
      for (let i = 1; i < rows.length; i++) {
        const missing = Math.round((rows[i].t - rows[i - 1].t) / dt) - 1;
        if (missing > 0 && missing <= o.maxGap) {
          for (let k = 1; k <= missing; k++) filled.push({ t: rows[i - 1].t + k * dt, co2: null, temp: null, hum: null });
        }
        filled.push(rows[i]);
      }
      rows = filled;
    }
    for (const k of METRICS) {
      let last = -1;
      for (let i = 0; i < rows.length; i++) {
        if (rows[i][k] === null) continue;
        const gap = i - last - 1;
        if (last >= 0 && gap > 0 && gap <= o.maxGap) {
          const a = rows[last];
          const b = rows[i];
          for (let j = last + 1; j < i; j++) {
            const ratio = (rows[j].t - a.t) / (b.t - a.t || 1);
            rows[j][k] = a[k] + (b[k] - a[k]) * ratio;
            rows[j].interpolated = true;
            rep.interp++;
          }
        }
        last = i;
      }
    }
  }
  rows = rows.filter((r) => r.co2 !== null || r.temp !== null || r.hum !== null);
  rep.output = rows.length;
  return { records: rows, rep };
}

function removeShortSegments(rows, minSec, gapSec) {
  if (!rows.length) return { rows, removedSegments: 0 };
  const minMs = Math.max(0, Number(minSec) || 0) * 1000;
  const diffs = rows.slice(1).map((r, i) => r.t - rows[i].t).filter((d) => d > 0).sort((a, b) => a - b);
  const step = quantile(diffs, 0.5) || 1000;
  const gapMs = Math.max(Math.max(1, Number(gapSec) || 5) * 1000, step * 3);
  const segs = [[rows[0]]];
  for (let i = 1; i < rows.length; i++) {
    if (rows[i].t - rows[i - 1].t > gapMs) segs.push([]);
    segs[segs.length - 1].push(rows[i]);
  }
  const keep = segs.filter((g) => g[g.length - 1].t - g[0].t + step >= minMs);
  return { rows: keep.flat(), removedSegments: segs.length - keep.length };
}
const processSessions = (sessions, o) =>
  sessions.map((s) => {
    const { records, rep } = cleanRecords(s.raw, o);
    return { ...s, records, cleaning: rep, excluded: records.length === 0, start: records[0]?.t ?? s.raw[0]?.t ?? 0 };
  });

/* ---------------- 이상치 ---------------- */
const DEFAULT_ANOMALY = {
  environment: 'outdoor',
  locationEnv: {},
  thresholds: {
    indoor: { co2Max: 1000, tempMin: 18, tempMax: 28, humMin: 30, humMax: 70 },
    outdoor: { co2Max: 600, tempMin: 0, tempMax: 35, humMin: 20, humMax: 95 },
  },
  statMethod: 'zscore',
  z: 3,
  iqrK: 1.5,
  spike: { enabled: true, co2: 100, temp: 1.5, hum: 5 },
  freeze: { enabled: true, minRepeats: 30 },
};
const mergeAnomaly = (a) => ({
  ...DEFAULT_ANOMALY,
  ...a,
  locationEnv: { ...(a?.locationEnv || {}) },
  thresholds: {
    indoor: { ...DEFAULT_ANOMALY.thresholds.indoor, ...(a?.thresholds?.indoor || {}) },
    outdoor: { ...DEFAULT_ANOMALY.thresholds.outdoor, ...(a?.thresholds?.outdoor || {}) },
  },
  spike: { ...DEFAULT_ANOMALY.spike, ...(a?.spike || {}) },
  freeze: { ...DEFAULT_ANOMALY.freeze, ...(a?.freeze || {}) },
});
const ANOMALY_LABEL = { threshold: '기준치 초과', zscore: 'Z-score', iqr: 'IQR', spike: '급변 스파이크', freeze: '센서 동결' };
const envOf = (loc, cfg) => cfg.locationEnv?.[loc] || guessEnv(loc) || cfg.environment;

function detectAnomalies(s, cfg) {
  const out = [];
  const th = cfg.thresholds[envOf(s.location, cfg)];
  const push = (t, metric, value, type, severity, message) => out.push({ id: `${s.id}-${out.length}`, sessionId: s.id, t, metric, value, type, severity, message });
  for (const k of METRICS) {
    const m = META[k];
    const f = (v) => `${v.toFixed(m.d)}${m.unit}`;
    const series = s.records.filter((r) => r[k] !== null).map((r) => ({ t: r.t, v: r[k] }));
    if (!series.length) continue;
    for (const p of series) {
      if (k === 'co2' && p.v > th.co2Max) push(p.t, k, p.v, 'threshold', p.v > th.co2Max * 1.5 ? 'critical' : 'warning', `CO₂ ${f(p.v)} > 기준 ${th.co2Max}ppm`);
      if (k === 'temp' && (p.v < th.tempMin || p.v > th.tempMax)) push(p.t, k, p.v, 'threshold', 'warning', `온도 ${f(p.v)} · 기준 ${th.tempMin}~${th.tempMax}°C 이탈`);
      if (k === 'hum' && (p.v < th.humMin || p.v > th.humMax)) push(p.t, k, p.v, 'threshold', 'warning', `습도 ${f(p.v)} · 기준 ${th.humMin}~${th.humMax}% 이탈`);
    }
    if (series.length < 5) continue;
    const vals = series.map((p) => p.v);
    if (cfg.statMethod === 'zscore') {
      const mu = mean(vals);
      const sd = std(vals);
      if (sd > 0) {
        for (const p of series) {
          const z = (p.v - mu) / sd;
          if (Math.abs(z) > cfg.z) push(p.t, k, p.v, 'zscore', Math.abs(z) > cfg.z * 1.5 ? 'critical' : 'warning', `Z=${z.toFixed(2)} (평균 ${f(mu)})`);
        }
      }
    } else if (cfg.statMethod === 'iqr') {
      const sorted = [...vals].sort((a, b) => a - b);
      const q1 = quantile(sorted, 0.25);
      const q3 = quantile(sorted, 0.75);
      const lo = q1 - cfg.iqrK * (q3 - q1);
      const hi = q3 + cfg.iqrK * (q3 - q1);
      for (const p of series) if (p.v < lo || p.v > hi) push(p.t, k, p.v, 'iqr', 'warning', `IQR 범위(${f(lo)}~${f(hi)}) 밖`);
    }
    if (cfg.spike.enabled) {
      for (let i = 1; i < series.length; i++) {
        const d = series[i].v - series[i - 1].v;
        if (Math.abs(d) > cfg.spike[k]) push(series[i].t, k, series[i].v, 'spike', Math.abs(d) > cfg.spike[k] * 2 ? 'critical' : 'warning', `직전 대비 ${d > 0 ? '+' : ''}${f(d)} 급변`);
      }
    }
    if (cfg.freeze.enabled) {
      let st = 0;
      for (let i = 1; i <= series.length; i++) {
        if (i < series.length && series[i].v === series[st].v) continue;
        if (i - st >= cfg.freeze.minRepeats) push(series[st].t, k, series[st].v, 'freeze', 'warning', `같은 값 ${i - st}회 연속 (센서 동결 의심)`);
        st = i;
      }
    }
  }
  return out.sort((a, b) => a.t - b.t);
}

/* ---------------- 분석 · 평가 ---------------- */
const sessionMeans = (s) => Object.fromEntries(METRICS.map((k) => [k, mean(finite(s.records.map((r) => r[k])))]));

function summarizeLocations(processed) {
  return [...groupBy(processed, (s) => s.location)]
    .map(([location, list]) => {
      const ss = [...list].sort((a, b) => a.start - b.start).map((s, i) => ({ id: s.id, date: s.date, start: s.start, order: i + 1, n: s.records.length, means: sessionMeans(s) }));
      const pick = (fn) => Object.fromEntries(METRICS.map((k) => [k, fn(finite(ss.map((x) => x.means[k])))]));
      return {
        location,
        sessions: ss,
        count: ss.length,
        records: ss.reduce((a, x) => a + x.n, 0),
        dates: [...new Set(ss.map((x) => x.date))].sort(),
        avg: pick(mean),
        sd: pick(std),
        min: pick((v) => (v.length ? Math.min(...v) : NaN)),
        max: pick((v) => (v.length ? Math.max(...v) : NaN)),
      };
    })
    .sort((a, b) => byKo(a.location, b.location));
}

const CRITERIA_TEXT = { co2: '50ppm 이상 저감', temp: '2°C 이상 하강(3°C 이상 뚜렷)', hum: '5~15%p 증가' };
const VERDICT_LABEL = { strong: '뚜렷한 효과', pass: '기준 충족', excess: '기준 초과', partial: '경향만 확인', reverse: '반대 경향', nodata: '데이터 없음' };
const VERDICT_TONE = { strong: 'good', pass: 'good', excess: 'warn', partial: 'warn', reverse: 'bad', nodata: 'muted' };
const effectDiff = (k, c, t) => (k === 'hum' ? t - c : c - t);
function judge(k, diff) {
  if (!Number.isFinite(diff)) return 'nodata';
  if (k === 'co2') return diff >= 50 ? 'pass' : diff > 0 ? 'partial' : 'reverse';
  if (k === 'temp') return diff >= 3 ? 'strong' : diff >= 2 ? 'pass' : diff > 0 ? 'partial' : 'reverse';
  return diff > 15 ? 'excess' : diff >= 5 ? 'pass' : diff > 0 ? 'partial' : 'reverse';
}
const isMet = (v) => v === 'pass' || v === 'strong';
function evaluate(control, target) {
  const metrics = {};
  for (const k of METRICS) {
    const diff = effectDiff(k, control.avg[k], target.avg[k]);
    metrics[k] = { metric: k, control: control.avg[k], target: target.avg[k], diff, verdict: judge(k, diff) };
  }
  const met = METRICS.filter((k) => isMet(metrics[k].verdict)).length;
  return { control, target, metrics, met };
}
function diffText(e) {
  if (!Number.isFinite(e.diff)) return '-';
  const a = Math.abs(e.diff).toFixed(1);
  if (e.metric === 'co2') return e.diff >= 0 ? `${a}ppm 낮음` : `${a}ppm 높음`;
  if (e.metric === 'temp') return e.diff >= 0 ? `${a}°C 낮음` : `${a}°C 높음`;
  return e.diff >= 0 ? `${a}%p 높음` : `${a}%p 낮음`;
}
function defaultControl(summaries, cfg) {
  const outdoor = summaries.filter((s) => envOf(s.location, cfg || DEFAULT_ANOMALY) !== 'indoor' && Number.isFinite(s.avg.co2));
  const pool = outdoor.length ? outdoor : summaries;
  if (!pool.length) return '';
  return pool.reduce((a, b) => ((b.avg.co2 ?? -1) > (a.avg.co2 ?? -1) ? b : a)).location;
}

function interpret(k, e) {
  const a = fmt(Math.abs(e.diff), 1);
  const head = `${META[k].name} ${fmt(e.control, META[k].d)}→${fmt(e.target, META[k].d)}${META[k].unit}: `;
  const T = {
    co2: {
      pass: `기준 장소보다 ${a}ppm 낮아 평가 기준(50ppm 이상 저감)을 충족했다. 식물의 광합성에 의한 CO₂ 흡수나 차량 배출원과의 거리 차이가 영향을 주었다고 해석할 수 있다.`,
      partial: `${a}ppm 낮았지만 기준(50ppm)에는 미치지 못했다. 저감 경향은 있으나 보급형 센서 오차(약 ±30~50ppm)를 고려하면 차이가 뚜렷하다고 보기 어렵다.`,
      reverse: `오히려 ${a}ppm 높았다. 측정 당시 주변 차량·사람 수, 바람, 환기 상태 등 다른 요인을 확인해야 한다.`,
      nodata: 'CO₂ 데이터가 부족해 비교할 수 없다.',
    },
    temp: {
      strong: `기준 장소보다 ${a}°C 낮아 3°C 이상의 뚜렷한 차이를 보였다. 녹지·수변의 그늘과 증발 냉각이 열섬 현상을 해소하는 효과로 해석할 수 있다.`,
      pass: `${a}°C 낮아 기준(2°C 이상)을 충족했다. 열섬 완화 효과가 나타났다고 볼 수 있으나 '뚜렷한 해소'(3°C)에는 미치지 못했다.`,
      partial: `${a}°C 낮았지만 기준(2°C)에는 미치지 못해 열섬 완화 효과를 단정하기 어렵다.`,
      reverse: `오히려 ${a}°C 높았다. 측정 시각의 햇빛 조건, 센서의 직사광선 노출 여부를 점검해야 한다.`,
      nodata: '온도 데이터가 부족해 비교할 수 없다.',
    },
    hum: {
      pass: `기준 장소보다 ${a}%p 높아 증산작용 판정 기준(5~15%p)에 해당한다. 식물이 잎의 기공으로 수증기를 내보내는 증산작용이 주변 습도를 높였다고 해석할 수 있다.`,
      excess: `${a}%p 높아 기준 범위(15%p)를 넘었다. 증산작용 외에 하천의 증발, 비 온 뒤 지면 수분 등 다른 수분 공급원의 영향일 수 있다.`,
      partial: `${a}%p 높았지만 기준(5%p)에 미치지 못해 증산작용의 영향은 제한적이다.`,
      reverse: `오히려 ${a}%p 낮았다. 측정한 날의 날씨 차이나 바람의 영향을 확인해야 한다.`,
      nodata: '습도 데이터가 부족해 비교할 수 없다.',
    },
  };
  return head + (T[k][e.verdict] || '');
}

function medianIntervalSec(processed) {
  const d = processed.flatMap((s) => s.records.slice(1).map((r, i) => (r.t - s.records[i].t) / 1000)).filter((x) => x > 0).sort((a, b) => a - b);
  return quantile(d, 0.5);
}

function generateAnalysis({ summaries, evals, control, processed, anomalies, cfg }) {
  if (!summaries.length) return '';
  const L = [];
  let no = 0;
  const sec = (t) => { no++; L.push('', `[${no}] ${t}`); };
  const dates = [...new Set(processed.map((s) => s.date))].sort();
  const counts = summaries.map((s) => s.count);
  sec('측정 개요');
  L.push(`- ${summaries.length}개 장소에서 ${koDate(dates[0])}~${koDate(dates[dates.length - 1])} 동안 총 ${counts.reduce((a, b) => a + b, 0)}회 측정하였다(장소별 ${Math.min(...counts)}~${Math.max(...counts)}회, 1회 약 1분). 장소별 값은 '측정 회차 평균'으로 비교하였다.`);

  sec('장소별 평균 비교');
  for (const k of METRICS) {
    const v = summaries.filter((s) => Number.isFinite(s.avg[k]));
    if (v.length < 2) continue;
    const hi = v.reduce((a, b) => (b.avg[k] > a.avg[k] ? b : a));
    const lo = v.reduce((a, b) => (b.avg[k] < a.avg[k] ? b : a));
    L.push(`- ${META[k].name}: 가장 높은 곳은 ${hi.location}(${fmt(hi.avg[k], 1)}${META[k].unit}), 가장 낮은 곳은 ${lo.location}(${fmt(lo.avg[k], 1)}${META[k].unit})로 ${fmt(hi.avg[k] - lo.avg[k], 1)}${META[k].du} 차이가 났다.`);
  }

  if (evals.length) {
    sec(`기준 장소(${control}) 대비 평가`);
    L.push('  평가 기준: CO₂ 50ppm 이상 저감 / 온도 2°C 이상 하강(열섬 완화), 3°C 이상(뚜렷한 열섬 해소) / 습도 5~15%p 증가(증산작용)');
    for (const e of evals) {
      L.push(`▶ ${e.target.location} (측정 ${e.target.count}회)`);
      if (cfg && envOf(e.target.location, cfg) !== envOf(control, cfg)) L.push('  · 참고: 기준 장소와 실내/야외 환경이 달라 같은 기준으로 직접 비교하기 어렵다.');
      for (const k of METRICS) L.push(`  · ${interpret(k, e.metrics[k])}`);
      const t = e.metrics.temp.verdict;
      const h = e.metrics.hum.verdict;
      if (isMet(t) && (h === 'pass' || h === 'excess')) {
        L.push('  · 종합: 기온은 낮고 습도는 높아, 물이 증발하면서 주변의 열(기화열)을 흡수하는 증발 냉각이 함께 작용했다고 볼 수 있다.');
      }
      L.push(`  → 평가 기준 3개 중 ${e.met}개 충족`);
    }
  }

  const all = summaries.flatMap((s) => s.sessions).filter((x) => METRICS.every((k) => Number.isFinite(x.means[k])));
  if (all.length >= 4) {
    sec(`항목 사이의 관계 (측정 회차 ${all.length}회의 평균값 기준)`);
    const rTH = pearson(all.map((x) => x.means.temp), all.map((x) => x.means.hum));
    const rTC = pearson(all.map((x) => x.means.temp), all.map((x) => x.means.co2));
    L.push(`- 온도와 습도: r = ${fmt(rTH, 2)} (${corrWord(rTH)}).${rTH <= -0.4 ? ' 같은 수증기량이라도 기온이 오르면 상대습도가 낮아지는 성질과 일치한다.' : ''}`);
    L.push(`- 온도와 CO₂: r = ${fmt(rTC, 2)} (${corrWord(rTC)}).`);
  }

  const multi = summaries.filter((s) => s.count >= 2);
  if (multi.length && summaries.length >= 2) {
    sec('측정한 날(날씨)의 영향');
    for (const k of METRICS) {
      const within = mean(finite(multi.map((s) => s.sd[k])));
      const av = finite(summaries.map((s) => s.avg[k]));
      const between = av.length ? Math.max(...av) - Math.min(...av) : NaN;
      if (!Number.isFinite(within) || !Number.isFinite(between)) continue;
      const big = within >= between * 0.5;
      L.push(`- ${META[k].name}: 같은 장소의 회차 간 표준편차 평균 ${fmt(within, 1)}${META[k].du}, 장소 간 최대 차이 ${fmt(between, 1)}${META[k].du} → ${big ? '날짜에 따른 변화가 장소 차이에 견줄 만큼 커서 장소 효과만으로 해석하기 어렵다.' : '장소 간 차이가 날짜에 따른 변화보다 커서 장소 특성의 영향이 상대적으로 크다.'}`);
    }
  }

  sec('해석할 때 주의할 점');
  L.push('- 장소마다 측정한 날이 달라 날씨(기온, 바람, 맑음·흐림)의 영향이 장소 차이에 섞여 있을 수 있다.');
  const single = summaries.filter((s) => s.count === 1).map((s) => s.location);
  if (single.length) L.push(`- ${josa(single.join(', '), '은', '는')} 1회만 측정하여 우연한 변동일 가능성이 있다.`);
  const drift = processed.filter((s) => {
    const v = s.records.map((r) => r.co2).filter((x) => x !== null);
    if (v.length < 10) return false;
    const n = Math.max(2, Math.floor(v.length * 0.15));
    return Math.abs(mean(v.slice(0, n)) - mean(v.slice(-n))) > 30;
  }).length;
  L.push(`- 1회 측정 시간이 약 1분으로 짧아 센서가 주변 공기에 적응하기 전 값이 포함될 수 있다.${drift ? ` 실제로 ${drift}회 측정에서 처음과 끝의 CO₂ 차이가 30ppm을 넘었다.` : ''}`);
  const an = [...anomalies.values()].reduce((n, a) => n + a.length, 0);
  if (an) L.push(`- 이상치 ${an}건이 감지되었다. [데이터 대시보드 > 측정 세션 상세]에서 원인을 확인하자.`);
  L.push('', '※ 자동 생성 초안입니다. 표와 그래프를 확인하며 자신의 말로 고쳐 쓰세요.');
  return L.join('\n').trim();
}

function generateMethod({ summaries, processed, region, control }) {
  const dates = [...new Set(processed.map((s) => s.date))].sort();
  const sec = medianIntervalSec(processed);
  const interval = !Number.isFinite(sec) ? '일정한' : sec >= 60 ? `${Math.round(sec / 60)}분` : `${Math.round(sec)}초`;
  return [
    `■ 측정 장소: ${region || ''} ${summaries.length}곳`.replace('  ', ' '),
    ...summaries.map((s) => `  - ${s.location}${s.location === control ? ' (기준 장소)' : ''}: ${s.dates.map(koDate).join(', ')} (${s.count}회)`),
    `■ 측정 기간: ${dates[0] || '-'} ~ ${dates[dates.length - 1] || '-'}`,
    '■ 측정 도구: 휴대용 CO₂·온습도 측정기 (기기 이름을 적으세요)',
    `■ 측정 방법: 각 장소에서 약 1분 동안 ${interval} 간격으로 자동 기록하였고, 장소마다 서로 다른 날 1~3회 측정하였다.`,
    '■ 데이터 처리: AirSense Analytics에 업로드 → 중복 정리·결측 보간·오작동 값 제거·연속 측정이 짧은 구간 제외 → 회차별 평균 → 장소별 회차 평균 비교',
    '■ 비교 기준: CO₂ 50ppm 이상 저감, 온도 2°C(3°C) 이상 하강, 습도 5~15%p 증가',
  ].join('\n');
}

function generateDiscovery({ summaries, evals }) {
  const L = ['(아래는 데이터에서 찾은 단서입니다. 직접 느낀 점으로 바꿔 쓰세요.)'];
  const v = summaries.filter((s) => Number.isFinite(s.avg.co2));
  if (v.length >= 2) {
    const hi = v.reduce((a, b) => (b.avg.co2 > a.avg.co2 ? b : a));
    const lo = v.reduce((a, b) => (b.avg.co2 < a.avg.co2 ? b : a));
    L.push(`- ${josa(hi.location, '과', '와')} ${lo.location}의 CO₂ 차이가 ${fmt(hi.avg.co2 - lo.avg.co2, 0)}ppm이나 되었다.`);
  }
  const best = [...evals].sort((a, b) => b.met - a.met)[0];
  if (best) L.push(`- ${best.target.location}${best.met ? `에서 평가 기준 ${best.met}개가 충족되어 장소 환경의 효과를 확인할 수 있었다.` : '도 기준을 충족하지 못해, 예상과 다른 결과의 원인을 생각해 보게 되었다.'}`);
  L.push('- 같은 장소라도 측정한 날에 따라 값이 달라진다는 점을 알게 되었다.');
  return L.join('\n');
}

/* ---------------- 예시 데이터 (10월 서울) ---------------- */
function sampleSessions() {
  let seed = 20261021;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const noise = (a) => (rnd() - 0.5) * 2 * a;
  const weather = { '2026-10-05': [1.8, -6], '2026-10-08': [0.4, 3], '2026-10-12': [-1.2, 8], '2026-10-15': [0.9, -2], '2026-10-19': [-2.0, 5], '2026-10-22': [-0.5, 0] };
  const places = [
    ['잠실역 사거리', 512, 21.8, 47, ['2026-10-05', '2026-10-12', '2026-10-19'], '13:10'],
    ['장지천 입구', 452, 19.4, 55, ['2026-10-08', '2026-10-15', '2026-10-22'], '13:40'],
    ['올림픽공원 숲길', 431, 18.6, 60, ['2026-10-05', '2026-10-19'], '14:20'],
    ['석촌호수 산책로', 447, 19.0, 58, ['2026-10-12'], '14:00'],
    ['학교 과학실', 905, 23.6, 43, ['2026-10-08', '2026-10-15'], '10:30'],
  ];
  const out = [];
  places.forEach(([loc, c0, t0, h0, dates, time], pi) => {
    dates.forEach((d, di) => {
      const [wt, wh] = weather[d] || [0, 0];
      const start = new Date(`${d}T${time}:00`).getTime();
      const cBase = c0 + noise(15);
      const raw = [];
      for (let i = 0; i < 60; i++) {
        let co2 = Math.round(cBase + noise(8) + (i < 8 ? (8 - i) * 4 : 0));
        if (pi === 0 && di === 1 && i === 37) co2 += 160;
        raw.push({ t: start + i * 1000, co2, temp: round(t0 + wt + noise(0.15) + i * 0.002, 1), hum: round(h0 + wh + noise(0.6), 1) });
      }
      out.push({ id: uid(), location: loc, date: d, label: `${loc}_${di + 1}회차`, sourceFile: `${loc}.zip/${di + 1}회차.csv`, timeGuessed: false, createdAt: Date.now(), raw });
    });
  });
  return out;
}

// ===================== 브라우저 저장소 (IndexedDB → LocalStorage 대체) =====================
const DB = (() => {
  let p = null;
  const open = () => {
    if (!p) {
      p = new Promise((res, rej) => {
        const r = indexedDB.open('airsense-analytics', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    return p;
  };
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode);
      const req = fn(t.objectStore('kv'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    async get(k) {
      try { return await tx('readonly', (s) => s.get(k)); } catch {
        try { const v = localStorage.getItem('airsense:' + k); return v ? JSON.parse(v) : undefined; } catch { return undefined; }
      }
    },
    async set(k, v) {
      try { await tx('readwrite', (s) => s.put(v, k)); return true; } catch {
        try { localStorage.setItem('airsense:' + k, JSON.stringify(v)); return true; } catch { return false; }
      }
    },
    async del(k) {
      try { await tx('readwrite', (s) => s.delete(k)); } catch { /* noop */ }
      try { localStorage.removeItem('airsense:' + k); } catch { /* noop */ }
    },
  };
})();

  }
  return locked ? { url: locked, status: 'locked' } : { url: '', status: 'missing' };
}

const fbUrl = (cfg, kind, code) => `${cfg.firebaseUrl.trim().replace(/\/+$/, '')}/airsense/${kind}/${code}.json`;

async function cloudGet(cfg, kind, code) {
  const url = cfg.provider === 'firebase' ? fbUrl(cfg, kind, code) : `${cfg.blobBase.trim().replace(/\/+$/, '')}/${code}`;
  const r = await fetch(url, { headers: { Accept: 'application/json' } });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`불러오기 실패 (HTTP ${r.status}). 주소·보안 규칙을 확인하세요.`);
  const v = await r.json();
  return v && v.json ? v : null;
}
async function cloudPut(cfg, kind, code, envelope) {
  const body = JSON.stringify(envelope);
  const headers = { 'Content-Type': 'application/json', Accept: 'application/json' };
  if (cfg.provider === 'firebase') {
    const r = await fetch(fbUrl(cfg, kind, code), { method: 'PUT', headers, body });
    if (!r.ok) throw new Error(`저장 실패 (HTTP ${r.status}). Firebase 보안 규칙에서 쓰기(.write)를 허용했는지 확인하세요.`);
    return code;
  }
  const base = cfg.blobBase.trim().replace(/\/+$/, '');
  if (code) {
    const r = await fetch(`${base}/${code}`, { method: 'PUT', headers, body });
    if (r.ok) return code;
    if (r.status !== 404) throw new Error(`저장 실패 (HTTP ${r.status})`);
  }
  const r = await fetch(base, { method: 'POST', headers, body });
  if (!r.ok) throw new Error(`저장 실패 (HTTP ${r.status})`);
  const loc = r.headers.get('Location') || r.headers.get('X-jsonblob') || '';
  let id = loc.split('/').filter(Boolean).pop();
  if (!id) {
    try { const j = await r.json(); id = j.id || j._id || ''; } catch { /* noop */ }
  }
  if (!id) throw new Error('저장은 되었지만 공유 코드를 받지 못했습니다(CORS 헤더 제한). Firebase 방식을 권장합니다.');
  return id;
}

const loadImage = (src) => new Promise((res, rej) => {

async function copyImage(dataUrl) {

  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  const blob = await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('변환 실패'))), 'image/png'));
  await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
}
async function compressImage(file, maxSize = 1280, quality = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const scale = Math.min(1, maxSize / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality);
  } finally {

  }
}

function tableToImage(t, scale = 2) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const F = '13px Pretendard, "Malgun Gothic", sans-serif';
  const FB = 'bold 13px Pretendard, "Malgun Gothic", sans-serif';
  const widths = t.head.map((h, i) => {
    ctx.font = FB;
    let w = ctx.measureText(h).width;
    ctx.font = F;
    for (const r of t.rows) w = Math.max(w, ctx.measureText(String(r[i] ?? '')).width);
    return Math.ceil(w) + 22;
  });
  const rowH = 28, capH = 30;
  const W = widths.reduce((a, b) => a + b, 0) + 2;
  const H = capH + rowH * (t.rows.length + 1) + 2;
  c.width = W * scale;
  c.height = H * scale;
  ctx.scale(scale, scale);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 14px Pretendard, "Malgun Gothic", sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText(t.caption, 1, capH / 2);
  [t.head, ...t.rows].forEach((row, ri) => {
    let x = 1;
    const y = capH + ri * rowH;
    row.forEach((cell, ci) => {
      if (ri === 0) { ctx.fillStyle = '#e2e8f0'; ctx.fillRect(x, y, widths[ci], rowH); }
      ctx.strokeStyle = '#64748b';
      ctx.strokeRect(x + 0.5, y + 0.5, widths[ci], rowH);
      ctx.fillStyle = '#0f172a';
      ctx.font = ri === 0 ? FB : F;
      ctx.textAlign = 'center';
      ctx.fillText(String(cell ?? ''), x + widths[ci] / 2, y + rowH / 2 + 1);
      x += widths[ci];
    });
  });
  return c.toDataURL('image/png');
}

function NamingSettingsModal({ naming, sessions, onApply, onClose }) {
  const [text, setText] = useState((naming.stripNames || []).join(', '));
  const [sample, setSample] = useState('박현정 장지천 다리 위 1일차20261014.zip');
  const [redo, setRedo] = useState(true);
  const names = useMemo(() => [...new Set(text.split(/[,\n;]+/).map((x) => x.normalize('NFC').trim()).filter(Boolean))], [text]);
  const draft = { ...naming, stripNames: names };
  const origins = useMemo(() => [...new Set(sessions.map((s) => s.originName || s.location))].sort(byKo), [sessions]);
  const suggestions = useMemo(() => {
    const cnt = new Map();
    for (const o of origins) {
      const w = o.normalize('NFC').trim().split(/[\s_\-]+/)[0];
      if (w && /^[가-힣A-Za-z]{2,5}$/.test(w)) cnt.set(w, (cnt.get(w) || 0) + 1);
    }
    return [...cnt].filter(([w, n]) => n >= 2 && !names.includes(w)).sort((a, b) => b[1] - a[1]).slice(0, 6);
  }, [origins, names]);
  const preview = origins.slice(0, 40).map((o) => ({ o, after: parseFileName(o, draft) }));
  const changedCount = sessions.filter((s) => {
    const info = parseFileName(s.originName || s.location, draft);
    return (info.location !== '미분류' && info.location !== s.location) || (info.date && info.date !== s.date);
  }).length;
  const sp = parseFileName(sample, draft);
  const addName = (w) => setText((t0) => (t0.trim() ? `${t0.trim().replace(/,$/, '')}, ${w}` : w));

  return html`<${Modal} title="장소명에서 뺄 이름 (파일명 인식 설정)" icon="UserX" onClose=${onClose} width="max-w-3xl"
    footer=${html`
      ${sessions.length ? html`<label className="mr-auto flex items-center gap-2 text-xs text-slate-300">
        <input type="checkbox" checked=${redo} onChange=${(e) => setRedo(e.target.checked)} className="h-4 w-4 accent-emerald-500" />
        이미 올린 데이터도 다시 분류 (${changedCount}회 변경 예정)
      </label>` : null}
      <${Button} onClick=${onClose}>취소<//>
      <${Button} variant="primary" onClick=${() => onApply(draft, redo)}>적용<//>`}>
    <div className="space-y-4 text-sm">
      <div>
        <label className="text-xs text-slate-400">뺄 이름 (쉼표 또는 줄바꿈으로 여러 명 입력)
          <textarea rows=${2} value=${text} onChange=${(e) => setText(e.target.value)} placeholder="예) 박현정, 김민수" className=${`${inputCls} mt-1`} />
        </label>
        <p className="mt-1 text-[11px] leading-5 text-slate-500">파일명에 따로 떨어진 단어로 들어 있을 때만 지웁니다. '박현정장지천'처럼 붙어 있으면 지우지 않으니, 그런 경우에는 장소 분류에서 이름을 직접 바꿔 주세요.</p>
        ${suggestions.length ? html`<div className="mt-2 flex flex-wrap items-center gap-1.5 text-xs">
          <span className="text-slate-500">파일명 앞에 반복되는 단어:</span>
          ${suggestions.map(([w, n]) => html`<button key=${w} type="button" onClick=${() => addName(w)}
            className="rounded-md border border-cyan-500/40 bg-cyan-500/10 px-2 py-0.5 text-cyan-200 hover:bg-cyan-500/20">+ ${w} <span className="text-cyan-400/70">(${n})</span></button>`)}
        </div>` : null}
      </div>

      <div className="rounded-lg border border-slate-800 bg-slate-950/50 p-3">
        <label className="text-xs text-slate-400">파일명 시험하기
          <input value=${sample} onChange=${(e) => setSample(e.target.value)} className=${`${inputCls} mt-1`} />
        </label>
        <p className="mt-2 text-xs text-slate-300">→ 장소 <b className="text-emerald-300">${sp.location}</b> · 회차 <b>${sp.round ?? '-'}</b> · 날짜 <b>${sp.date ?? '-'}</b></p>
      </div>

      ${preview.length ? html`<div>
        <p className="mb-1 text-xs font-semibold text-slate-300">현재 데이터 미리보기</p>
        <div className="max-h-64 overflow-auto rounded-lg border border-slate-800">
          <table className="w-full text-xs">
            <thead className="sticky top-0 bg-slate-900 text-slate-400"><tr>
              <th className="px-3 py-1.5 text-left">원래 이름</th><th className="px-3 py-1.5 text-left">장소</th><th className="px-3 py-1.5 text-right">회차</th><th className="px-3 py-1.5 text-right">날짜</th>
            </tr></thead>
            <tbody className="divide-y divide-slate-800">
              ${preview.map(({ o, after }) => html`<tr key=${o}>
                <td className="px-3 py-1.5 text-slate-400">${o}</td>
                <td className="px-3 py-1.5 font-medium text-emerald-300">${after.location}</td>
                <td className="px-3 py-1.5 text-right tabular-nums">${after.round ?? '-'}</td>
                <td className="px-3 py-1.5 text-right tabular-nums">${after.date ?? '-'}</td>
              </tr>`)}
            </tbody>
          </table>
        </div>
      </div>` : null}
    </div>
  <//>`;
}

// ===================== 장소 분류 관리 =====================
function ClassificationManager({ processed, anomalyCounts, selectedId, onSelect, onUpdate, onRename, onRemove, onRemoveLocation }) {
  const groups = useMemo(() => [...groupBy(processed, (s) => s.location)].sort(([a], [b]) => byKo(a, b)).map(([l, list]) => [l, [...list].sort((a, b) => a.start - b.start)]), [processed]);
  const locations = groups.map(([l]) => l);
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState('');
  if (!processed.length) return null;
  const commit = () => {
    const to = draft.trim();
    if (editing && to && to !== editing) onRename(editing, to);
    setEditing(null);
  };
  const move = (s, v) => {
    if (v === '__new') {
      const name = prompt('새 장소 이름')?.trim();
      if (name) onUpdate(s.id, { location: name });
    } else onUpdate(s.id, { location: v });
  };
  return html`<${Card} title=${`장소 분류 (${locations.length}곳 · ${processed.length}회)`} icon="MapPin" bodyClass="divide-y divide-slate-800 px-3 py-2">
    ${groups.map(([loc, list]) => html`<div key=${loc} className="py-2">
      <div className="flex items-center gap-1.5">
        ${editing === loc ? html`
          <input autoFocus value=${draft} onChange=${(e) => setDraft(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') setEditing(null); }}
            className="min-w-0 flex-1 rounded border border-emerald-500/60 bg-slate-950 px-2 py-0.5 text-sm" />
          <button type="button" onClick=${commit} className="text-emerald-400"><${Icon} name="Check" /></button>
          <button type="button" onClick=${() => setEditing(null)} className="text-slate-500"><${Icon} name="X" /></button>
        ` : html`
          <span className="flex-1 truncate text-sm font-semibold text-slate-100">${loc}</span>
          <${Badge} tone="info">${list.length}회<//>
          <button type="button" title="장소명 변경" onClick=${() => { setEditing(loc); setDraft(loc); }} className="text-slate-500 hover:text-slate-200"><${Icon} name="Pencil" size=${14} /></button>
          <button type="button" title="장소 삭제" onClick=${() => { if (confirm(`'${loc}'의 측정 ${list.length}회를 삭제할까요?`)) onRemoveLocation(loc); }} className="text-slate-500 hover:text-rose-400"><${Icon} name="Trash2" size=${14} /></button>
        `}
      </div>
      <ul className="mt-1.5 space-y-1 pl-2">
        ${list.map((s, i) => {
          const an = anomalyCounts.get(s.id) || 0;
          return html`<li key=${s.id} className=${`group rounded-md px-2 py-1.5 text-xs ${selectedId === s.id ? 'bg-emerald-500/10 ring-1 ring-emerald-500/30' : 'hover:bg-slate-800/60'}`}>
            <div className="flex items-center gap-2">
              <button type="button" onClick=${() => onSelect(s.id)} className="flex-1 truncate text-left text-slate-200 hover:text-emerald-300" title=${s.sourceFile}>${i + 1}회차 · ${s.label}</button>
              ${an > 0 ? html`<${Badge} tone="warn">이상 ${an}<//>` : null}
              ${s.timeGuessed ? html`<${Badge} tone="muted">시각 추정<//>` : null}
              ${s.excluded ? html`<span title="연속 측정 시간이 설정값보다 짧아 분석에서 제외됨 (정제 설정에서 변경)"><${Badge} tone="bad">짧은 측정 제외<//></span>` : null}
              <button type="button" title="삭제" onClick=${() => onRemove(s.id)} className="text-slate-600 hover:text-rose-400"><${Icon} name="Trash2" size=${14} /></button>
            </div>
            <div className="mt-1 flex items-center gap-2 text-slate-500">
              <input type="date" value=${s.date} onChange=${(e) => e.target.value && onUpdate(s.id, { date: e.target.value })} className="rounded border border-slate-700 bg-slate-950 px-1 text-slate-300" />
              <span>${hhmm(s.start)}</span>
              <span>${s.records.length}건</span>
              <select value=${s.location} onChange=${(e) => move(s, e.target.value)} className="ml-auto max-w-[6.5rem] rounded border border-slate-700 bg-slate-950 px-1 text-slate-300">
                ${locations.map((l) => html`<option key=${l} value=${l}>${l}</option>`)}
                <option value="__new">+ 새 장소</option>
              </select>
            </div>
          </li>`;
        })}
      </ul>
    </div>`)}
  <//>`;
}

function CompareDashboard({ processed, summaries }) {
  const [k, setK] = useState('co2');
  const [overlayLoc, setOverlayLoc] = useState('');
  const m = META[k];
  const overall = mean(finite(summaries.map((s) => s.avg[k])));
  const loc = summaries.some((s) => s.location === overlayLoc) ? overlayLoc : summaries[0]?.location;
  const barCfg = useMemo(() => locationBarConfig(summaries, k, THEME.dark), [summaries, k]);
  const trendCfg = useMemo(() => dateTrendConfig(summaries, k, THEME.dark), [summaries, k]);
  const overlayCfg = useMemo(() => overlayConfig(processed.filter((s) => s.location === loc).sort((a, b) => a.start - b.start), k, THEME.dark), [processed, loc, k]);
  if (!processed.length) {
    return html`<${Empty} icon="GitCompareArrows" title="비교할 데이터가 없습니다" desc="왼쪽에 장소별 ZIP 또는 CSV 파일을 올리거나 [예시 데이터]로 기능을 먼저 살펴보세요." />`;
  }
  const maxN = Math.max(...summaries.map((s) => s.count));
  return html`<div className="space-y-5">
    <div className="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h2 className="text-lg font-bold">장소별 vs 날짜별 차이 분석</h2>
        <p className="text-sm text-slate-400">장소 ${summaries.length}곳 · 측정 ${processed.length}회 · 장소 값 = 측정 회차(최대 ${maxN}회) 평균</p>
      </div>
      <${MetricTabs} value=${k} onChange=${setK} />
    </div>

    <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
      ${summaries.map((s, i) => {
        const dev = s.avg[k] - overall;
        return html`<div key=${s.location} className="rounded-xl border border-slate-800 bg-slate-900/70 p-4">
          <div className="flex items-center gap-2 text-sm font-semibold">
            <span className="h-2.5 w-2.5 rounded-full" style=${{ background: PALETTE[i % PALETTE.length] }}></span>
            <span className="truncate">${s.location}</span>
            <span className="ml-auto text-xs font-normal text-slate-500">${s.count}회</span>
          </div>
          <p className="mt-2 text-2xl font-bold tabular-nums" style=${{ color: m.color }}>${fmt(s.avg[k], m.d)}<span className="ml-1 text-sm font-normal text-slate-400">${m.unit}</span></p>
          <p className="text-xs text-slate-400">전체 평균 대비 <b className=${dev > 0 ? 'text-rose-300' : 'text-emerald-300'}>${signed(dev, m.d)}${m.du}</b>${s.count > 1 ? ` · 회차 간 σ ${fmt(s.sd[k], 1)}` : ''}</p>
          <p className="mt-2 border-t border-slate-800 pt-2 text-[11px] text-slate-500">${s.dates.map(koDate).join(' · ')}</p>
        </div>`;
      })}
    </div>

    <div className="grid gap-5 xl:grid-cols-2">
      <${Card} title=${`장소별 회차 평균 ${m.label} (막대) · 각 회차 값 (점)`} icon="MapPin">
        <${ChartBox} config=${barCfg} height=${280} />
      <//>
      <${Card} title=${`날짜별 ${m.label} 변화 (장소별 선)`} icon="CalendarDays" iconClass="text-cyan-400">
        <${ChartBox} config=${trendCfg} height=${280} />
      <//>
    </div>

    <${Card} title=${`1분 측정 곡선 겹쳐 보기 · ${m.label}`} icon="Activity" iconClass="text-cyan-400"
      actions=${html`<select value=${loc} onChange=${(e) => setOverlayLoc(e.target.value)} className="rounded-md border border-slate-700 bg-slate-950 px-2 py-1 text-xs">
        ${summaries.map((s) => html`<option key=${s.location} value=${s.location}>${s.location}</option>`)}
      </select>`}>
      <${ChartBox} config=${overlayCfg} height=${240} />
    <//>

    <${Card} title=${`장소 × 회차 편차표 (${m.label}, 괄호 = 장소 평균 대비)`} icon="Table2" iconClass="text-slate-400" bodyClass="overflow-x-auto">
      <table className="w-full text-sm">
        <thead className="bg-slate-900 text-xs text-slate-400">
          <tr>
            <th className="px-4 py-2 text-left">장소</th>
            ${Array.from({ length: maxN }, (_, i) => html`<th key=${i} className="px-4 py-2 text-right">${i + 1}회차</th>`)}
            <th className="px-4 py-2 text-right text-emerald-300">회차 평균</th>
            <th className="px-4 py-2 text-right">전체 평균 대비</th>
          </tr>
        </thead>
        <tbody className="divide-y divide-slate-800">
          ${summaries.map((s) => html`<tr key=${s.location}>
            <td className="px-4 py-2 font-medium">${s.location}</td>
            ${Array.from({ length: maxN }, (_, i) => {
              const x = s.sessions[i];
              if (!x) return html`<td key=${i} className="px-4 py-2 text-right text-slate-600">-</td>`;
              const dev = x.means[k] - s.avg[k];
              return html`<td key=${i} className="px-4 py-2 text-right tabular-nums">
                ${fmt(x.means[k], m.d)} <span className=${`text-xs ${dev > 0 ? 'text-rose-300' : dev < 0 ? 'text-emerald-300' : 'text-slate-500'}`}>(${signed(dev, 1)})</span>
                <div className="text-[10px] text-slate-500">${koDate(x.date)}</div>
              </td>`;
            })}
            <td className="px-4 py-2 text-right font-semibold tabular-nums text-emerald-300">${fmt(s.avg[k], m.d)}</td>
            <td className=${`px-4 py-2 text-right tabular-nums ${s.avg[k] - overall > 0 ? 'text-rose-300' : 'text-emerald-300'}`}>${signed(s.avg[k] - overall, 1)}</td>
          </tr>`)}
        </tbody>
      </table>
    <//>

    ${summaries.length >= 2 ? html`<${Card} title=${`장소 간 차이 매트릭스 (행 − 열, ${m.du})`} icon="Grid3x3" iconClass="text-slate-400" bodyClass="overflow-x-auto">
      <table className="w-full text-sm">
        <thead className="text-xs text-slate-400"><tr><th className="px-4 py-2"></th>${summaries.map((c) => html`<th key=${c.location} className="px-4 py-2 text-right">${c.location}</th>`)}</tr></thead>
        <tbody className="divide-y divide-slate-800">
          ${summaries.map((r) => html`<tr key=${r.location}>
            <td className="px-4 py-2 font-medium">${r.location}</td>
            ${summaries.map((c) => {
              const v = r.avg[k] - c.avg[k];
              return html`<td key=${c.location} className=${`px-4 py-2 text-right tabular-nums ${r === c ? 'text-slate-600' : v > 0 ? 'text-rose-300' : 'text-emerald-300'}`}>${r === c ? '—' : signed(v, 1)}</td>`;
            })}
          </tr>`)}
        </tbody>
      </table>
    <//>` : null}
  </div>`;
}

// ===================== 모드 2: 세션 상세 · 이상치 로그 =====================
function SessionDetail({ processed, anomalies, selectedId, onSelect, cfg }) {
  const s = processed.find((x) => x.id === selectedId) || processed[0];
  const [visible, setVisible] = useState({ co2: true, temp: true, hum: true });
  const [xk, setXk] = useState('temp');
  const [yk, setYk] = useState('hum');
  const [filter, setFilter] = useState('all');
  const list = s ? anomalies.get(s.id) || [] : [];
  const th = s ? cfg.thresholds[envOf(s.location, cfg)] : DEFAULT_ANOMALY.thresholds.outdoor;
  const seriesCfg = useMemo(() => (s ? sessionSeriesConfig(s, list, visible, th.co2Max, THEME.dark) : null), [s, list, visible, th.co2Max]);
  const sc = useMemo(() => {
    if (!s) return { cfg: null, r: NaN };
    const pts = s.records.filter((r) => r[xk] !== null && r[yk] !== null).map((r) => ({ x: round(r[xk], 2), y: round(r[yk], 2) }));
    return { cfg: scatterConfig(pts, xk, yk, THEME.dark), r: pearson(pts.map((p) => p.x), pts.map((p) => p.y)), n: pts.length };
  }, [s, xk, yk]);
  if (!s) return html`<${Empty} icon="Activity" title="측정 회차가 없습니다" desc="데이터를 업로드하면 회차별 시계열·상관·이상치 분석을 볼 수 있습니다." />`;
  const order = processed.filter((x) => x.location === s.location).sort((a, b) => a.start - b.start).findIndex((x) => x.id === s.id) + 1;
  const shown = filter === 'all' ? list : list.filter((a) => a.type === filter);
  const critical = list.filter((a) => a.severity === 'critical').length;
  const stat = (k) => {
    const v = finite(s.records.map((r) => r[k]));
    return { mean: mean(v), sd: std(v), min: v.length ? Math.min(...v) : NaN, max: v.length ? Math.max(...v) : NaN };
  };
  const dur = s.records.length > 1 ? (s.records[s.records.length - 1].t - s.records[0].t) / 1000 : 0;
  return html`<div className="space-y-5">
    <div className="flex flex-wrap items-center gap-3">
      <div>
        <h2 className="text-lg font-bold">${s.location} · ${order}회차</h2>
        <p className="text-sm text-slate-400">${fmtDT(s.start)} · 측정 ${mmss(dur)} · ${s.sourceFile} · ${envOf(s.location, cfg) === 'indoor' ? '실내 기준' : '야외 기준'}</p>
      </div>
      <select value=${s.id} onChange=${(e) => onSelect(e.target.value)} className="ml-auto rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm">
        ${[...groupBy([...processed].sort((a, b) => a.start - b.start), (x) => x.location)].sort(([a], [b]) => byKo(a, b)).map(([l, ss]) => html`<optgroup key=${l} label=${l}>
          ${ss.map((x, i) => html`<option key=${x.id} value=${x.id}>${l} ${i + 1}회차 · ${koDate(x.date)}</option>`)}
        </optgroup>`)}
      </select>
    </div>

    <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-5">
      ${METRICS.map((k) => {
        const st = stat(k);
        return html`<div key=${k} className="rounded-xl border border-slate-800 bg-slate-900/70 p-4">
          <p className="text-xs text-slate-400">${META[k].label} 평균</p>
          <p className="mt-1 text-2xl font-bold tabular-nums" style=${{ color: META[k].color }}>${fmt(st.mean, META[k].d)}<span className="ml-1 text-sm font-normal text-slate-400">${META[k].unit}</span></p>
          <p className="text-xs text-slate-500">범위 ${fmt(st.min, META[k].d)}~${fmt(st.max, META[k].d)} · σ ${fmt(st.sd, 2)}</p>
        </div>`;
      })}
      <div className="rounded-xl border border-slate-800 bg-slate-900/70 p-4">
        <p className="text-xs text-slate-400">유효 데이터</p>
        <p className="mt-1 text-2xl font-bold tabular-nums">${s.records.length}</p>
        <p className="text-xs text-slate-500">원본 ${s.cleaning.input} · 중복 ${s.cleaning.dup} · 보간 ${s.cleaning.interp} · 제외 ${s.cleaning.out} · 짧은 구간 ${s.cleaning.short || 0}</p>
      </div>
      <div className="rounded-xl border border-slate-800 bg-slate-900/70 p-4">
        <p className="text-xs text-slate-400">이상치</p>
        <p className=${`mt-1 text-2xl font-bold tabular-nums ${list.length ? 'text-amber-300' : 'text-emerald-300'}`}>${list.length}</p>
        <p className="text-xs text-slate-500">심각 ${critical} · 주의 ${list.length - critical}</p>
      </div>
    </div>

    <${Card} title="시계열 추이 (1분 측정)" icon="Activity"
      actions=${html`<div className="flex gap-1">${METRICS.map((k) => html`<button key=${k} type="button" onClick=${() => setVisible((v) => ({ ...v, [k]: !v[k] }))}
        className=${`rounded-md border px-2 py-0.5 text-xs ${visible[k] ? 'border-slate-600 text-slate-100' : 'border-slate-800 text-slate-600'}`}>
        <span className="mr-1 inline-block h-2 w-2 rounded-full" style=${{ background: META[k].color }}></span>${META[k].label}</button>`)}</div>`}>
      <${ChartBox} config=${seriesCfg} height=${300} />
    <//>

    <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_minmax(0,1.4fr)]">
      <${Card} title="산점도 · 상관분석" icon="Sigma" iconClass="text-cyan-400"
        actions=${html`<div className="flex items-center gap-1 text-xs">
          <select value=${xk} onChange=${(e) => setXk(e.target.value)} className="rounded border border-slate-700 bg-slate-950 px-1 py-0.5">${METRICS.map((k) => html`<option key=${k} value=${k}>${META[k].label}</option>`)}</select>
          <span className="text-slate-500">vs</span>
          <select value=${yk} onChange=${(e) => setYk(e.target.value)} className="rounded border border-slate-700 bg-slate-950 px-1 py-0.5">${METRICS.map((k) => html`<option key=${k} value=${k}>${META[k].label}</option>`)}</select>
        </div>`}>
        <p className="mb-2 text-sm">상관계수 <b className="text-cyan-300">r = ${fmt(sc.r, 3)}</b> <span className="ml-1 text-xs text-slate-400">${corrWord(sc.r)} · n=${sc.n || 0}</span></p>
        <${ChartBox} config=${sc.cfg} height=${240} />
        <p className="mt-2 text-[11px] text-slate-500">1분 측정은 변화 폭이 작아 상관계수가 불안정할 수 있습니다. 장소 간 관계는 보고서의 '항목 사이의 관계'(회차 평균 기준)를 함께 보세요.</p>
      <//>
      <${Card} title=${`이상치 탐지 로그 (${shown.length})`} icon="AlertTriangle" iconClass="text-amber-400" bodyClass="p-0">
        <div className="flex flex-wrap gap-1 border-b border-slate-800 px-4 py-2">
          ${['all', ...Object.keys(ANOMALY_LABEL)].map((t) => html`<button key=${t} type="button" onClick=${() => setFilter(t)}
            className=${`rounded-md px-2 py-0.5 text-xs ${filter === t ? 'bg-amber-500/15 text-amber-300' : 'text-slate-400 hover:text-slate-200'}`}>
            ${t === 'all' ? `전체 ${list.length}` : `${ANOMALY_LABEL[t]} ${list.filter((a) => a.type === t).length}`}</button>`)}
        </div>
        <div className="max-h-[320px] overflow-auto">
          <table className="w-full text-xs">
            <thead className="sticky top-0 bg-slate-900 text-slate-400">
              <tr><th className="px-3 py-2 text-left">경과</th><th className="px-3 py-2 text-left">항목</th><th className="px-3 py-2 text-right">값</th><th className="px-3 py-2 text-left">유형</th><th className="px-3 py-2 text-left">내용</th></tr>
            </thead>
            <tbody className="divide-y divide-slate-800">
              ${shown.slice(0, 500).map((a) => html`<tr key=${a.id} className="hover:bg-slate-800/40">
                <td className="whitespace-nowrap px-3 py-1.5 tabular-nums text-slate-300">${mmss((a.t - s.start) / 1000)}</td>
                <td className="px-3 py-1.5" style=${{ color: META[a.metric].color }}>${META[a.metric].label}</td>
                <td className="px-3 py-1.5 text-right tabular-nums">${fmt(a.value, META[a.metric].d)}</td>
                <td className="px-3 py-1.5"><${Badge} tone=${a.severity === 'critical' ? 'bad' : 'warn'}>${ANOMALY_LABEL[a.type]}<//></td>
                <td className="px-3 py-1.5 text-slate-400">${a.message}</td>
              </tr>`)}
              ${shown.length ? null : html`<tr><td colSpan=${5} className="px-3 py-8 text-center text-slate-500">감지된 이상치가 없습니다.</td></tr>`}
            </tbody>
          </table>
        </div>
      <//>
    </div>
  </div>`;
}

// ===================== 모달: 데이터 정제 =====================
function DataCleaningModal({ options, sessions, onApply, onClose }) {
  const [d, setD] = useState(options);
  const set = (k, v) => setD((p) => ({ ...p, [k]: v }));
  const setRange = (k, side, v) => setD((p) => ({ ...p, ranges: { ...p.ranges, [k]: { ...p.ranges[k], [side]: v } } }));
  const pv = useMemo(() => sessions.reduce((a, s) => {
    const { rep } = cleanRecords(s.raw, d);
    return { input: a.input + rep.input, dup: a.dup + rep.dup, out: a.out + rep.out, interp: a.interp + rep.interp, short: a.short + rep.short,
      shortSeg: a.shortSeg + rep.shortSeg, dropped: a.dropped + (rep.input > 0 && rep.output === 0 ? 1 : 0), output: a.output + rep.output };
  }, { input: 0, dup: 0, out: 0, interp: 0, short: 0, shortSeg: 0, dropped: 0, output: 0 }), [sessions, d]);
  return html`<${Modal} title="데이터 정제 설정" icon="Sparkles" onClose=${onClose}
    footer=${html`<${Button} variant="ghost" onClick=${() => setD(DEFAULT_CLEANING)}>기본값<//><${Button} onClick=${onClose}>취소<//><${Button} variant="primary" onClick=${() => onApply(d)}>적용<//>`}>
    <div className="space-y-3">
      <${Toggle} label="정제 사용" desc="해제하면 원본을 그대로 분석합니다. 원본 데이터는 항상 보존됩니다." checked=${d.enabled} onChange=${(v) => set('enabled', v)} />
      <fieldset disabled=${!d.enabled} className="space-y-3 disabled:opacity-40">
        <${Toggle} label="중복 타임스탬프 정리" desc="같은 초에 기록된 여러 행을 하나로 합칩니다." checked=${d.removeDuplicates} onChange=${(v) => set('removeDuplicates', v)} />
        ${d.removeDuplicates ? html`<div className="flex gap-4 pl-7 text-sm">
          ${[['mean', '평균값으로 병합'], ['first', '첫 번째 값 유지']].map(([k, l]) => html`<label key=${k} className="flex items-center gap-1.5 text-slate-300">
            <input type="radio" checked=${d.duplicateStrategy === k} onChange=${() => set('duplicateStrategy', k)} className="accent-emerald-500" />${l}</label>`)}
        </div>` : null}
        <${Toggle} label="누락 결측치 선형보간" desc="빠진 시각과 빈 값을 앞뒤 값으로 직선 보간합니다." checked=${d.interpolate} onChange=${(v) => set('interpolate', v)} />
        ${d.interpolate ? html`<div className="w-48 pl-7"><${NumField} label="최대 보간 구간" unit="포인트" value=${d.maxGap} onChange=${(v) => set('maxGap', Math.max(1, v))} /></div>` : null}
        <${Toggle} label="센서 오작동치 필터링" desc="물리적으로 불가능한 범위의 값을 결측으로 처리합니다." checked=${d.filterMalfunction} onChange=${(v) => set('filterMalfunction', v)} />
        ${d.filterMalfunction ? html`<div className="grid gap-3 pl-7 sm:grid-cols-3">
          ${METRICS.map((k) => html`<div key=${k} className="space-y-1.5 rounded-lg border border-slate-800 p-2">
            <p className="text-xs font-semibold" style=${{ color: META[k].color }}>${META[k].label}</p>
            <${NumField} label="최소" unit=${META[k].unit} value=${d.ranges[k].min} onChange=${(v) => setRange(k, 'min', v)} />
            <${NumField} label="최대" unit=${META[k].unit} value=${d.ranges[k].max} onChange=${(v) => setRange(k, 'max', v)} />
          </div>`)}
        </div>` : null}
        <${Toggle} label="짧은 연속 측정 구간 제외" desc="기록이 끊기지 않고 이어진 구간이 설정한 시간보다 짧으면 분석에서 뺍니다. 회차 전체가 짧으면 그 회차는 평균·그래프·보고서에서 제외됩니다." checked=${d.removeShort} onChange=${(v) => set('removeShort', v)} />
        ${d.removeShort ? html`<div className="grid max-w-md grid-cols-2 gap-3 pl-7">
          <${NumField} label="최소 연속 측정 시간" unit="초" value=${d.minDuration} onChange=${(v) => set('minDuration', Math.max(0, v))} />
          <${NumField} label="끊김으로 볼 간격" unit="초" value=${d.splitGap} onChange=${(v) => set('splitGap', Math.max(1, v))} />
          <p className="col-span-2 text-[11px] leading-5 text-slate-500">예) 1초 간격 기록에서 5초보다 오래 비면 구간이 나뉘고, 각 구간이 20초 미만이면 제외합니다. 기록 간격이 긴 기기는 평소 간격의 3배까지 연속으로 봅니다.</p>
        </div>` : null}
      </fieldset>
      <div className="grid grid-cols-3 gap-2 rounded-lg bg-slate-950/60 p-3 text-center text-xs sm:grid-cols-6">
        ${[['원본', pv.input], ['중복 병합', pv.dup], ['오작동 제외', pv.out], ['보간', pv.interp], ['짧은 구간 제외', pv.short], ['결과', pv.output]].map(([l, v]) => html`<div key=${l}><p className="text-slate-500">${l}</p><p className="text-base font-bold text-slate-100 tabular-nums">${v.toLocaleString()}</p></div>`)}
      </div>
      ${d.enabled && d.removeShort && (pv.shortSeg > 0) ? html`<p className="rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-xs text-amber-200">
        짧은 구간 ${pv.shortSeg}개(${pv.short.toLocaleString()}행)를 제외합니다.${pv.dropped ? ` 이 중 ${pv.dropped}개 회차는 전체가 ${d.minDuration}초 미만이라 분석에서 빠집니다.` : ''}
      </p>` : null}
    </div>
  <//>`;
}

// ===================== 모달: 종합 공기질 리포트 =====================
function buildSummaryHtml({ summaries, evals, control, processed, anomalies, cfg }) {
  const all = [...anomalies.values()].flat();
  const dates = processed.map((s) => s.date).sort();
  const recs = [];
  for (const s of summaries) {
    const th = cfg.thresholds[envOf(s.location, cfg)];
    if (s.avg.co2 > th.co2Max) recs.push(`${s.location}: 평균 CO₂ ${fmt(s.avg.co2, 0)}ppm으로 기준(${th.co2Max}ppm)을 넘었습니다. 환기와 배출원을 점검하세요.`);
    if (s.avg.temp > th.tempMax) recs.push(`${s.location}: 평균 기온 ${fmt(s.avg.temp)}°C로 높습니다. 그늘·녹지 확충을 검토하세요.`);
    if (s.avg.hum < th.humMin || s.avg.hum > th.humMax) recs.push(`${s.location}: 평균 습도 ${fmt(s.avg.hum)}%로 권장 범위(${th.humMin}~${th.humMax}%)를 벗어났습니다.`);
    if (s.count === 1) recs.push(`${s.location}: 측정이 1회뿐이므로 추가 측정을 권장합니다.`);
  }
  const fr = all.filter((a) => a.type === 'freeze').length;
  if (fr) recs.push(`센서 동결 의심 ${fr}건 — 센서 전원과 통신 상태를 점검하세요.`);
  if (!recs.length) recs.push('모든 장소의 평균값이 설정된 기준 범위 안에 있습니다.');
  const anomTable = { caption: `[표 4] 이상치 요약 (총 ${all.length}건)`, head: Object.values(ANOMALY_LABEL), rows: [Object.keys(ANOMALY_LABEL).map((t) => String(all.filter((a) => a.type === t).length))] };
  const T = reportTables({ summaries, evals, control });
  return `<h1 style="font-size:17pt;margin:0 0 4px;">종합 공기질 분석 리포트</h1>
    <p style="color:#475569;margin:0 0 14px;border-bottom:2px solid #0f172a;padding-bottom:8px;">기간 ${esc(dates[0] || '-')} ~ ${esc(dates[dates.length - 1] || '-')} · 장소 ${summaries.length}곳 · 측정 ${processed.length}회 · 기준 장소 ${esc(control || '-')} · 생성 ${esc(new Date().toLocaleString('ko-KR'))}</p>
    ${T.map(htmlTable).join('')}${htmlTable(anomTable)}
    <p style="font-weight:bold;margin:14px 0 4px;">종합 의견 및 권고</p><ul style="margin:0;padding-left:18px;line-height:1.7;">${recs.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`;
}
function ReportModal({ processed, summaries, anomalies, cfg, onClose }) {
  const [control, setControl] = useState(() => defaultControl(summaries, cfg));
  const evals = useMemo(() => {
    const c = summaries.find((s) => s.location === control);
    return c ? summaries.filter((s) => s !== c).map((s) => evaluate(c, s)) : [];
  }, [summaries, control]);
  const body = buildSummaryHtml({ summaries, evals, control, processed, anomalies, cfg });
  const doPrint = () => {
    const charts = METRICS.map((k) => `<div style="text-align:center;margin:8px 0;"><img src="${chartToImage(locationBarConfig(summaries, k, THEME.light, { control, title: `장소별 ${META[k].name} (${META[k].unit})` }), 900, 380)}" style="width:100%;max-width:640px;"></div>`).join('');
    printHtml(wrapDoc('종합 공기질 분석 리포트', body + charts));
  };
  return html`<${Modal} title="종합 공기질 분석 리포트" icon="FileText" onClose=${onClose} width="max-w-5xl"
    footer=${html`<label className="mr-auto flex items-center gap-2 text-sm text-slate-400">기준(대조) 장소
        <select value=${control} onChange=${(e) => setControl(e.target.value)} className="rounded border border-slate-700 bg-slate-950 px-2 py-1 text-slate-200">
          ${summaries.map((s) => html`<option key=${s.location} value=${s.location}>${s.location}</option>`)}
        </select></label>
      <${Button} onClick=${onClose}>닫기<//><${Button} variant="primary" icon="Printer" onClick=${doPrint}>인쇄 / PDF<//>`}>
    <div className="overflow-x-auto rounded-lg bg-white p-6 text-[13px] text-slate-900" dangerouslySetInnerHTML=${{ __html: body }}></div>
  <//>`;
}

// ===================== 모달: 저장 / 불러오기 (브라우저 · 클라우드 공유 코드 · 파일) =====================
function StorageModal({ kind, onClose, buildPayload, applyPayload, cloudCfg, setCloudCfg, notify }) {
  const label = kind === 'data' ? '측정 데이터' : '탐구 보고서';
  const [tab, setTab] = useState(kind === 'report' ? 'cloud' : 'browser');
  const [name, setName] = useState('');
  const [snaps, setSnaps] = useState([]);
  const [code, setCode] = useState('');
  const [recent, setRecent] = useState([]);
  const [includeData, setIncludeData] = useState(true);
  const [busy, setBusy] = useState(false);
  const [showSetup, setShowSetup] = useState(false);
  const findFirebase = async () => {
    setBusy(true);
    try {
      const r = await detectFirebaseUrl(cloudCfg.firebaseUrl);
      if (r.status === 'missing') {
        notify('greenmap-cac85 프로젝트의 Realtime Database를 찾지 못했습니다. Firebase 콘솔에서 Realtime Database를 먼저 만들고, 화면 맨 위의 주소를 복사해 이 칸에 붙여 넣어 주세요.', 'error');
        return;
      }
      setCloudCfg({ ...cloudCfg, provider: 'firebase', firebaseUrl: r.url, fbChecked: r.status === 'ok' });
      notify(r.status === 'ok' ? `연결을 확인했습니다: ${r.url}` : '데이터베이스는 찾았지만 보안 규칙이 접근을 막고 있습니다. 아래 규칙을 Firebase 콘솔 > Realtime Database > 규칙에 붙여 넣고 게시하세요.', r.status === 'ok' ? 'success' : 'error');
    } finally {
      setBusy(false);
    }
  };
  const fileRef = useRef(null);
  const snapKey = `snapshots:${kind}`;
  const recentKey = `cloud:recent:${kind}`;
  useEffect(() => {
    DB.get(snapKey).then((v) => setSnaps(v || []));
    DB.get(recentKey).then((v) => { setRecent(v || []); if (v && v[0]) setCode(v[0].code); });
  }, []);
  const payload = () => buildPayload({ includeData });
  const sizeKB = useMemo(() => Math.round(JSON.stringify(buildPayload({ includeData })).length / 1024), [includeData]);

  const saveSnap = async () => {
    const item = { id: uid(), name: name.trim() || `${label} ${new Date().toLocaleString('ko-KR')}`, savedAt: Date.now(), payload: payload() };
    const next = [item, ...snaps].slice(0, 30);
    if (await DB.set(snapKey, next)) { setSnaps(next); setName(''); notify(`'${item.name}'(으)로 이 브라우저에 저장했습니다.`, 'success'); }
    else notify('브라우저 저장 공간이 부족합니다. 파일로 저장해 주세요.', 'error');
  };
  const loadSnap = (s) => {
    if (!confirm(`'${s.name}'을(를) 불러올까요? 현재 ${label}가 바뀝니다.`)) return;
    try { applyPayload(s.payload, kind); notify(`'${s.name}'을(를) 불러왔습니다.`, 'success'); onClose(); } catch (e) { notify(e.message, 'error'); }
  };
  const delSnap = async (s) => {
    if (!confirm(`'${s.name}'을(를) 삭제할까요?`)) return;
    const next = snaps.filter((x) => x.id !== s.id);
    await DB.set(snapKey, next);
    setSnaps(next);
  };
  const remember = async (c) => {
    const next = [{ code: c, at: Date.now() }, ...recent.filter((r) => r.code !== c)].slice(0, 8);
    setRecent(next);
    await DB.set(recentKey, next);
  };
  const markSync = async (c, at) => {
    const s = (await DB.get('cloud:sync')) || {};
    s[`${kind}:${c}`] = at;
    await DB.set('cloud:sync', s);
  };
  const doCloudSave = async () => {
    if (!cloudReady(cloudCfg)) { setShowSetup(true); notify('먼저 클라우드 저장소 주소를 설정하세요.', 'error'); return; }
    let c = cleanCode(code);
    if (!c && cloudCfg.provider === 'firebase') c = genCode();
    setBusy(true);
    try {
      if (c) {
        const remote = await cloudGet(cloudCfg, kind, c).catch(() => null);
        const last = ((await DB.get('cloud:sync')) || {})[`${kind}:${c}`] || 0;
        if (remote && remote.deviceId !== DEVICE_ID && remote.updatedAt > last
          && !confirm(`다른 기기(${remote.deviceName || '알 수 없음'})가 ${new Date(remote.updatedAt).toLocaleString('ko-KR')}에 저장한 더 새로운 내용이 있습니다.\n그래도 덮어쓸까요?\n(취소한 뒤 '불러오기'로 먼저 받아오는 것을 권장합니다)`)) return;
      }
      const env = { app: APP, kind, updatedAt: Date.now(), deviceId: DEVICE_ID, deviceName: deviceName(), json: JSON.stringify(payload()) };
      const saved = await cloudPut(cloudCfg, kind, c, env);
      setCode(saved);
      await markSync(saved, env.updatedAt);
      await remember(saved);
      notify(`클라우드에 저장했습니다. 공유 코드: ${saved}`, 'success');
    } catch (e) {
      notify(e.message || '클라우드 저장에 실패했습니다.', 'error');
    } finally {
      setBusy(false);
    }
  };
  const doCloudLoad = async () => {
    const c = cleanCode(code);
    if (!c) { notify('공유 코드를 입력하세요.', 'error'); return; }
    if (!cloudReady(cloudCfg)) { setShowSetup(true); notify('먼저 클라우드 저장소 주소를 설정하세요.', 'error'); return; }
    setBusy(true);
    try {
      const remote = await cloudGet(cloudCfg, kind, c);
      if (!remote) { notify('이 공유 코드로 저장된 내용이 없습니다.', 'error'); return; }
      if (!confirm(`${remote.deviceName || '다른 기기'}에서 ${new Date(remote.updatedAt).toLocaleString('ko-KR')}에 저장한 ${label}를 불러올까요?`)) return;
      applyPayload(JSON.parse(remote.json), kind);
      await markSync(c, remote.updatedAt);
      await remember(c);
      notify('클라우드에서 불러왔습니다. 수정 후 다시 [클라우드에 저장]하면 다른 기기에서도 이어서 편집할 수 있습니다.', 'success');
      onClose();
    } catch (e) {
      notify(e.message || '불러오기에 실패했습니다.', 'error');
    } finally {
      setBusy(false);
    }
  };
  const saveFile = () => {
    downloadBlob(JSON.stringify(payload()), `airsense_${kind === 'data' ? '데이터' : '보고서'}_${stamp()}.json`, 'application/json');
    notify('.json 파일로 저장했습니다.', 'success');
  };
  const loadFile = async (f) => {
    try { applyPayload(JSON.parse(await f.text()), kind); notify(`${f.name}을(를) 불러왔습니다.`, 'success'); onClose(); } catch (e) { notify(e.message || '파일을 읽지 못했습니다.', 'error'); }
  };
  const tabs = [['browser', '이 브라우저', 'HardDrive'], ['cloud', '클라우드 (공유 코드)', 'Cloud'], ['file', '파일 (.json)', 'FileJson']];
  return html`<${Modal} title=${`${label} 저장 / 불러오기`} icon="Save" onClose=${onClose} width="max-w-3xl">
    <div className="mb-4 flex flex-wrap rounded-lg border border-slate-800 bg-slate-950/40 p-1">
      ${tabs.map(([id, l, ic]) => html`<button key=${id} type="button" onClick=${() => setTab(id)} className=${`flex flex-1 items-center justify-center gap-1.5 rounded-md px-3 py-1.5 text-sm ${tab === id ? 'bg-emerald-500/15 text-emerald-300' : 'text-slate-400'}`}><${Icon} name=${ic} />${l}</button>`)}
    </div>
    ${kind === 'report' ? html`<label className="mb-4 flex items-center gap-2 rounded-lg border border-slate-800 p-3 text-sm text-slate-300">
      <input type="checkbox" checked=${includeData} onChange=${(e) => setIncludeData(e.target.checked)} className="accent-emerald-500" />
      측정 데이터도 함께 저장 (다른 기기에서도 표·그래프·자동 분석이 그대로 보입니다) <span className="ml-auto text-xs text-slate-500">약 ${sizeKB.toLocaleString()}KB</span>
    </label>` : null}

    ${tab === 'browser' ? html`<div className="space-y-3">
      <p className="text-xs text-slate-400">이 기기·이 브라우저 안에 이름을 붙여 여러 개 저장합니다(로그인 불필요). 작업 내용은 별도로 자동 저장도 됩니다.</p>
      <div className="flex gap-2">
        <input value=${name} onChange=${(e) => setName(e.target.value)} placeholder=${`저장 이름 (예: ${kind === 'data' ? '10월 3주차 측정' : '보고서 2차 수정'})`} className=${inputCls} />
        <${Button} variant="primary" icon="Save" onClick=${saveSnap}>저장<//>
      </div>
      <ul className="max-h-72 divide-y divide-slate-800 overflow-auto rounded-lg border border-slate-800">
        ${snaps.length ? snaps.map((s) => html`<li key=${s.id} className="flex items-center gap-2 px-3 py-2 text-sm">
          <div className="min-w-0 flex-1"><p className="truncate text-slate-200">${s.name}</p><p className="text-xs text-slate-500">${new Date(s.savedAt).toLocaleString('ko-KR')}</p></div>
          <${Button} size="sm" icon="FolderOpen" onClick=${() => loadSnap(s)}>불러오기<//>
          <button type="button" onClick=${() => delSnap(s)} className="text-slate-500 hover:text-rose-400"><${Icon} name="Trash2" /></button>
        </li>`) : html`<li className="px-3 py-6 text-center text-sm text-slate-500">저장된 항목이 없습니다.</li>`}
      </ul>
    </div>` : null}

    ${tab === 'cloud' ? html`<div className="space-y-3">
      <p className="text-xs leading-5 text-slate-400">같은 <b className="text-cyan-300">공유 코드</b>를 입력하면 휴대폰·태블릿·다른 PC에서도 로그인 없이 불러와 이어서 편집할 수 있습니다. 마지막에 저장한 내용이 남으며, 다른 기기가 더 최근에 저장했다면 덮어쓰기 전에 알려 줍니다.</p>
      <div className="flex flex-wrap gap-2">
