            ${[['firebase', 'Firebase Realtime Database (권장)'], ['jsonblob', 'JSON Blob 호환 API']].map(([p, l]) => html`<label key=${p} className="flex items-center gap-1.5 text-slate-300">
              <input type="radio" checked=${cloudCfg.provider === p} onChange=${() => setCloudCfg({ ...cloudCfg, provider: p })} className="accent-emerald-500" />${l}</label>`)}

          ${cloudCfg.provider === 'firebase' ? html`<div className="space-y-2">
            <p className="text-xs text-slate-400">연결된 Firebase 프로젝트: <b className="font-mono text-cyan-300">${FIREBASE_CONFIG.projectId}</b> ${cloudCfg.fbChecked ? html`<span className="text-emerald-300">· 연결 확인됨</span>` : html`<span className="text-amber-300">· 연결 확인 전</span>`}</p>
            <div className="flex gap-2">
              <input value=${cloudCfg.firebaseUrl} onChange=${(e) => setCloudCfg({ ...cloudCfg, firebaseUrl: e.target.value, fbChecked: false })} placeholder="https://greenmap-cac85-default-rtdb.asia-southeast1.firebasedatabase.app" className=${`${inputCls} font-mono text-xs`} />
              <button type="button" disabled=${busy} onClick=${findFirebase} className="shrink-0 rounded-lg border border-cyan-500/40 px-3 py-1.5 text-xs text-cyan-200 hover:bg-cyan-500/10 disabled:opacity-40">${busy ? '확인 중…' : '주소 자동 찾기 · 연결 확인'}</button>
            </div>
            <ol className="list-decimal space-y-1 pl-5 text-xs leading-5 text-slate-400">
              <li>프로젝트(<b>greenmap-cac85</b>)는 이미 연결되어 있습니다. Firebase 콘솔의 이 프로젝트에서 <b>빌드 → Realtime Database → 데이터베이스 만들기</b>를 한 번 해 주세요(위치는 싱가포르 asia-southeast1 권장).</li>
              <li>규칙(Rules)에 아래를 붙여 넣고 게시합니다. 학생들은 로그인 없이 공유 코드만으로 사용합니다.<pre className="mt-1 rounded bg-slate-950 p-2 font-mono text-[11px] text-emerald-300">{"rules": {"airsense": {".read": true, ".write": true}}}</pre></li>
              <li>[주소 자동 찾기 · 연결 확인]을 누릅니다. 찾지 못하면 Realtime Database 화면 맨 위 주소를 위 칸에 붙여 넣거나, 파일의 <code>FIREBASE_CONFIG.databaseURL</code>에 적어 두면 모든 기기에 바로 적용됩니다.</li>
            </ol>
            <p className="text-xs text-amber-300">공유 코드를 아는 사람은 누구나 읽고 수정할 수 있으니 개인정보(연락처, 얼굴이 크게 나온 사진 등)는 올리지 마세요.</p>

            <input value=${cloudCfg.blobBase} onChange=${(e) => setCloudCfg({ ...cloudCfg, blobBase: e.target.value })} className=${`${inputCls} font-mono text-xs`} />
            <p className="text-xs leading-5 text-slate-400">POST(생성) · GET(읽기) · PUT(수정)을 지원하는 JSON Blob 호환 주소입니다. jsonblob.com은 현재 쓰기에 인증이 필요해 사용할 수 없고, 외부 무료 서비스는 CORS 정책·운영 여부가 바뀔 수 있으니 먼저 시험 저장해 보세요.</p>
          </div>`}
        </div>` : null}
      </div>
    </div>` : null}

    ${tab === 'file' ? html`<div className="grid gap-3 sm:grid-cols-2">
      <button type="button" onClick=${saveFile} className="rounded-xl border border-slate-700 p-5 text-left hover:border-emerald-400">
        <${Icon} name="Download" size=${24} className="text-emerald-400" /><p className="mt-2 font-semibold">파일로 저장</p><p className="text-xs text-slate-400">.json 파일을 내려받습니다. USB·메신저·클라우드 드라이브로 다른 기기에 옮길 수 있습니다.</p>
      </button>
      <button type="button" onClick=${() => fileRef.current?.click()} className="rounded-xl border border-slate-700 p-5 text-left hover:border-cyan-400">
        <${Icon} name="FolderOpen" size=${24} className="text-cyan-400" /><p className="mt-2 font-semibold">파일에서 불러오기</p><p className="text-xs text-slate-400">AirSense Analytics에서 저장한 .json 파일을 엽니다.</p>
      </button>
      <input ref=${fileRef} type="file" accept=".json,application/json" className="hidden" onChange=${(e) => { const f = e.target.files?.[0]; if (f) loadFile(f); e.target.value = ''; }} />
    </div>` : null}
  <//>`;
}

// ===================== 보고서: 이미지 첨부 =====================
function ImageAttachments({ images, figNo, onAdd, onCaption, onRemove, onCopy, hint }) {
  const ref = useRef(null);
  const [over, setOver] = useState(false);
  const pick = (list) => {
    const files = [...(list || [])].filter((f) => f.type.startsWith('image/'));
    if (files.length) onAdd(files);
  };
  const onPaste = (e) => {
    const files = [...e.clipboardData.items].filter((i) => i.kind === 'file' && i.type.startsWith('image/')).map((i) => i.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); pick(files); }
  };
  return html`<div className="space-y-3">
    <div tabIndex=${0} onPaste=${onPaste} onClick=${() => ref.current?.click()}
      onDragOver=${(e) => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)}
      onDrop=${(e) => { e.preventDefault(); setOver(false); pick(e.dataTransfer.files); }}
      className=${`flex cursor-pointer items-center justify-center gap-2 rounded-lg border border-dashed px-3 py-3 text-xs outline-none transition focus:border-cyan-400 ${over ? 'border-cyan-400 bg-cyan-500/10 text-cyan-200' : 'border-slate-700 text-slate-400 hover:border-slate-500'}`}>
      <${Icon} name="ImagePlus" />${hint} (클릭 · 드래그 · 이 칸을 누른 뒤 Ctrl+V)
      <input ref=${ref} type="file" accept="image/*" multiple className="hidden" onChange=${(e) => { pick(e.target.files); e.target.value = ''; }} />
    </div>
    ${images.length ? html`<div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
      ${images.map((img) => html`<figure key=${img.id} className="overflow-hidden rounded-lg border border-slate-800 bg-slate-950">
        <div className="relative">
          <img src=${img.dataUrl} alt=${img.caption} className="h-40 w-full bg-white object-contain" />
          <div className="absolute left-2 top-2"><${Badge} tone=${img.kind === 'capture' ? 'info' : 'muted'}>${img.kind === 'capture' ? '캡처' : '사진'}<//></div>
        </div>
        <figcaption className="flex items-center gap-1.5 p-2">
          <span className="shrink-0 text-[11px] font-semibold text-cyan-300">그림 ${figNo.get(img.id)}</span>
          <input value=${img.caption} onChange=${(e) => onCaption(img.id, e.target.value)} placeholder="그림 설명" className="min-w-0 flex-1 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs" />
          <button type="button" title="이미지 복사 (HWP 붙여넣기용)" onClick=${() => onCopy(img)} className="text-slate-500 hover:text-cyan-300"><${Icon} name="Copy" size=${14} /></button>
          <button type="button" title="삭제" onClick=${() => onRemove(img.id)} className="text-slate-500 hover:text-rose-400"><${Icon} name="Trash2" size=${14} /></button>
        </figcaption>
      </figure>`)}
    </div>` : null}
  </div>`;
}

// ===================== 보고서 대시보드 =====================
function InquiryReportView({ processed, summaries, anomalies, cfg, report, setReport, notify, onOpenStorage }) {
  const [chartK, setChartK] = useState('co2');
  const [busy, setBusy] = useState(false);
  const names = summaries.map((s) => s.location);
  const control = names.includes(report.controlLocation) ? report.controlLocation : defaultControl(summaries, cfg);
  const evals = useMemo(() => {
    const c = summaries.find((s) => s.location === control);
    return c ? summaries.filter((s) => s !== c).map((s) => evaluate(c, s)) : [];
  }, [summaries, control]);
  const ctx = { summaries, evals, control };
  const tables = useMemo(() => reportTables(ctx), [summaries, evals, control]);
  const barCfg = useMemo(() => locationBarConfig(summaries, chartK, THEME.dark, { control }), [summaries, chartK, control]);
  const trendCfg = useMemo(() => dateTrendConfig(summaries, chartK, THEME.dark), [summaries, chartK]);
  const ordered = useMemo(() => ['process', 'analysis'].flatMap((sec) => report.images.filter((i) => i.section === sec)), [report.images]);
  const figNo = useMemo(() => {
    const auto = summaries.length ? 3 : 0;
    const proc = report.images.filter((i) => i.section === 'process');
    const ana = report.images.filter((i) => i.section === 'analysis');
    return new Map([...proc.map((i, n) => [i.id, n + 1]), ...ana.map((i, n) => [i.id, proc.length + auto + n + 1])]);
  }, [ordered, summaries.length]);
  const filled = FIELD_KEYS.filter((k) => report.fields[k].trim()).length;

  const touch = (fn) => setReport((r) => ({ ...fn(r), updatedAt: Date.now() }));
  const setField = (k, v) => touch((r) => ({ ...r, fields: { ...r.fields, [k]: v } }));
  const setMeta = (k, v) => touch((r) => ({ ...r, [k]: v }));

  const fill = (key, text) => {
    if (!text) return;
    const cur = report.fields[key].trim();
    if (cur && !confirm('이미 작성한 내용이 있습니다.\n[확인] 자동 초안으로 바꾸기\n[취소] 기존 내용 뒤에 덧붙이기')) setField(key, `${cur}\n\n${text}`);
    else setField(key, text);
    notify('측정 데이터로 초안을 입력했습니다. 내용을 확인하고 다듬어 주세요.', 'success');
  };
  const autoText = (type) => {
    if (!summaries.length) { notify('먼저 데이터 대시보드에서 측정 데이터를 올려 주세요.', 'error'); return ''; }
    if (type === 'method') return generateMethod({ summaries, processed, region: report.region, control });
    if (type === 'analysis') {
      if (summaries.length < 2) notify('장소가 2곳 이상이어야 기준 장소 대비 평가가 들어갑니다.', 'info');
      return generateAnalysis({ summaries, evals, control, processed, anomalies, cfg });
    }
    return generateDiscovery({ summaries, evals });
  };

  const addImages = async (section, files) => {
    try {
      const items = await Promise.all(files.map(async (f) => ({
        id: uid(), section, kind: 'photo', createdAt: Date.now(), dataUrl: await compressImage(f),
        caption: /^image\.(png|jpe?g)$/i.test(f.name) ? '' : f.name.replace(/\.[^.]+$/, ''),
      })));
      touch((r) => ({ ...r, images: [...r.images, ...items] }));
      notify(`이미지 ${items.length}장을 첨부했습니다.`, 'success');
    } catch {
      notify('이미지를 읽지 못했습니다.', 'error');
    }
  };
  const addCapture = (dataUrl, caption) => {
    touch((r) => ({ ...r, images: [...r.images, { id: uid(), section: 'analysis', kind: 'capture', dataUrl, caption, createdAt: Date.now() }] }));
    notify('캡처 이미지를 [3. 탐구 분석]에 첨부했습니다.', 'success');
  };
  const captureChart = (type) => {
    const m = META[chartK];
    const title = type === 'bar' ? `장소별 ${m.name} 회차 평균 (${m.unit})` : `날짜별 ${m.name} 변화 (${m.unit})`;
    const cfg2 = type === 'bar' ? locationBarConfig(summaries, chartK, THEME.light, { control, title }) : dateTrendConfig(summaries, chartK, THEME.light, { title });
    addCapture(chartToImage(cfg2), title);
  };
  const updateImg = (id, patch) => touch((r) => ({ ...r, images: r.images.map((i) => (i.id === id ? { ...i, ...patch } : i)) }));
  const removeImg = (id) => touch((r) => ({ ...r, images: r.images.filter((i) => i.id !== id) }));
  const copyImg = async (img) => {
    try { await copyImage(img.dataUrl); notify('이미지를 복사했습니다. 한글(HWP)·워드에서 Ctrl+V 하세요.', 'success'); } catch { notify('이 브라우저는 이미지 복사를 지원하지 않습니다. 이미지를 길게 눌러 저장해 주세요.', 'error'); }
  };

  const autoCharts = () => (summaries.length ? METRICS.map((k) => {
    const caption = `장소별 ${META[k].name} 회차 평균 (${META[k].unit})`;
    return { caption, src: chartToImage(locationBarConfig(summaries, k, THEME.light, { control, title: caption }), 900, 400) };
  }) : []);
  const copyHwp = async () => {
    setBusy(true);
    try {
      const body = buildReportHtml(report, ctx, autoCharts());
      const mode = await copyRich(`<html><body style="font-family:'맑은 고딕',sans-serif;font-size:10.5pt;">${body}</body></html>`, buildReportText(report, ctx));
      notify(mode === 'rich' ? '표 서식을 포함해 복사했습니다. 한글(HWP)·워드에서 Ctrl+V 하세요. 그림이 빠지면 각 그림의 복사 버튼을 이용하세요.' : '텍스트로 복사했습니다(이 브라우저는 서식 복사를 지원하지 않음).', 'success');
    } finally {
      setBusy(false);
    }
  };
  const doPrint = () => printHtml(wrapDoc(report.title || '과학 탐구 보고서', buildReportHtml(report, ctx, autoCharts())));
  const textDownload = () => downloadBlob('\uFEFF' + buildReportText(report, ctx), `${safeName(report.title || '탐구보고서')}.txt`, 'text/plain;charset=utf-8');

  const judgeBadge = (e) => html`<${Badge} tone=${VERDICT_TONE[e.verdict]}>${VERDICT_LABEL[e.verdict]}<//>`;

  return html`<div className="mx-auto max-w-[1200px] space-y-5">
    <div className="flex flex-wrap items-center gap-2">
      <div>
        <h2 className="text-lg font-bold">과학 탐구 보고서</h2>
        <p className="text-xs text-slate-400">작성 ${filled}/${FIELD_KEYS.length} 항목 · 그림 ${report.images.length}장 · ${report.updatedAt ? `마지막 수정 ${new Date(report.updatedAt).toLocaleString('ko-KR')}` : '아직 수정 없음'} · 브라우저에 자동 저장</p>
      </div>
      <div className="ml-auto flex flex-wrap gap-1.5">
        <${Button} size="sm" variant="cyan" icon="Cloud" onClick=${onOpenStorage}>보고서 저장 / 불러오기<//>
        <${Button} size="sm" icon=${busy ? 'Loader2' : 'ClipboardCopy'} disabled=${busy} onClick=${copyHwp}>HWP·워드용 복사<//>
        <${Button} size="sm" icon="FileText" onClick=${textDownload}>텍스트 저장<//>
        <${Button} size="sm" variant="primary" icon="Printer" onClick=${doPrint}>인쇄 / PDF<//>
        <${Button} size="sm" variant="danger" icon="RotateCcw" onClick=${() => { if (confirm('보고서 내용을 모두 지울까요? (측정 데이터는 유지됩니다)')) setReport(() => ({ ...emptyReport(), updatedAt: Date.now() })); }}>새로 쓰기<//>
      </div>
    </div>

    <${Card} title="기본 정보" icon="IdCard">
      <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
        <label className="text-xs text-slate-400 lg:col-span-2">탐구 제목<input value=${report.title} onChange=${(e) => setMeta('title', e.target.value)} placeholder="예) 녹지와 하천은 도시의 공기를 바꿀까?" className=${`${inputCls} mt-1`} /></label>
        <label className="text-xs text-slate-400">측정 지역<input value=${report.region} onChange=${(e) => setMeta('region', e.target.value)} className=${`${inputCls} mt-1`} /></label>
        <label className="text-xs text-slate-400">학교 · 팀<input value=${report.school} onChange=${(e) => setMeta('school', e.target.value)} placeholder="○○중학교 과학탐구반" className=${`${inputCls} mt-1`} /></label>
        <label className="text-xs text-slate-400">참여 학생<input value=${report.members} onChange=${(e) => setMeta('members', e.target.value)} placeholder="홍길동, 김철수" className=${`${inputCls} mt-1`} /></label>
      </div>
    <//>

    ${SECTIONS.map((sec) => html`<${Card} key=${sec.key} title=${sec.title} icon=${{ plan: 'Lightbulb', exec: 'Footprints', analysis: 'ChartColumn', reflect: 'Telescope' }[sec.key]} bodyClass="space-y-5 p-4">
      ${sec.fields.map((f) => html`<div key=${f.key} className="space-y-2">
        <div className="flex flex-wrap items-center gap-2">
          <h4 className="text-sm font-semibold text-slate-100">□ ${f.label}</h4>
          ${f.auto ? html`<${Button} size="sm" variant=${f.auto === 'analysis' ? 'primary' : 'ghost'} icon="Wand2" className="ml-auto"
            onClick=${() => fill(f.key, autoText(f.auto))}>${f.auto === 'analysis' ? '자동 분석 생성' : '데이터로 초안'}<//>` : null}
        </div>

        ${f.data ? html`<div className="space-y-4 rounded-lg border border-slate-800 bg-slate-950/40 p-3">
          ${summaries.length ? html`
            <div className="flex flex-wrap items-center gap-2">
              <${MetricTabs} value=${chartK} onChange=${setChartK} />
              <span className="text-xs text-slate-500">회색 막대 = 기준 장소 · 점 = 각 회차 값</span>
            </div>
            <div className="grid gap-4 lg:grid-cols-2">
              <div>
                <div className="mb-1 flex items-center justify-between text-xs text-slate-400">장소별 회차 평균<${Button} size="sm" variant="ghost" icon="Camera" onClick=${() => captureChart('bar')}>캡처 첨부<//></div>
                <${ChartBox} config=${barCfg} height=${240} />
              </div>
              <div>
                <div className="mb-1 flex items-center justify-between text-xs text-slate-400">날짜별 변화<${Button} size="sm" variant="ghost" icon="Camera" onClick=${() => captureChart('trend')}>캡처 첨부<//></div>
                <${ChartBox} config=${trendCfg} height=${240} />
              </div>
            </div>
            ${tables.map((t) => html`<div key=${t.caption} className="rounded-lg border border-slate-800">
              <div className="flex items-center justify-between border-b border-slate-800 px-3 py-2 text-xs font-semibold text-slate-300">${t.caption}
                <${Button} size="sm" variant="ghost" icon="Camera" onClick=${() => addCapture(tableToImage(t), t.caption.replace(/^\[표 \d+\]\s*/, ''))}>표 캡처 첨부<//>
              </div>
              <${DataTable} table=${t} dense=${true} />
            </div>`)}
            <p className="text-[11px] text-slate-500">인쇄·HWP 복사 시 표 1~3과 항목별 그래프 3개(CO₂·온도·습도)가 자동으로 들어갑니다. 아래 첨부는 추가 그림입니다.</p>
          ` : html`<p className="py-6 text-center text-sm text-slate-500">측정 데이터가 없습니다. [데이터 대시보드]에서 파일을 올리거나, 데이터가 포함된 보고서를 불러오세요.</p>`}
        </div>` : null}

        ${f.auto === 'analysis' && summaries.length ? html`<div className="rounded-lg border border-emerald-500/30 bg-emerald-500/5 p-3">
          <div className="mb-2 flex flex-wrap items-center gap-2 text-sm">
            <${Icon} name="Scale" className="text-emerald-400" />
            <b>데이터 분석 창</b>
            <label className="ml-auto flex items-center gap-2 text-xs text-slate-400">기준(대조) 장소
              <select value=${control} onChange=${(e) => setMeta('controlLocation', e.target.value)} className="rounded border border-slate-700 bg-slate-950 px-2 py-1 text-slate-200">
                ${names.map((n) => html`<option key=${n} value=${n}>${n}</option>`)}
              </select>
            </label>
          </div>
          <p className="mb-2 text-[11px] text-slate-400">평가 기준 — CO₂ <b className="text-emerald-300">50ppm 이상 저감</b> · 온도 <b className="text-amber-300">2°C 이상 하강(열섬 완화), 3°C 이상(뚜렷한 열섬 해소)</b> · 습도 <b className="text-cyan-300">5~15%p 증가(증산작용)</b></p>
          ${evals.length ? html`<div className="overflow-x-auto"><table className="w-full text-xs">
            <thead className="text-slate-400"><tr><th className="px-2 py-1.5 text-left">비교 장소</th>${METRICS.map((k) => html`<th key=${k} className="px-2 py-1.5 text-left">${META[k].label} (${CRITERIA_TEXT[k]})</th>`)}<th className="px-2 py-1.5 text-right">충족</th></tr></thead>
            <tbody className="divide-y divide-slate-800">
              ${evals.map((e) => html`<tr key=${e.target.location}>
                <td className="px-2 py-1.5 font-medium">${e.target.location} <span className="text-slate-500">(${e.target.count}회)</span></td>
                ${METRICS.map((k) => html`<td key=${k} className="px-2 py-1.5"><span className="mr-1.5 tabular-nums text-slate-200">${diffText(e.metrics[k])}</span>${judgeBadge(e.metrics[k])}</td>`)}
                <td className="px-2 py-1.5 text-right font-semibold tabular-nums">${e.met}/3</td>
              </tr>`)}
            </tbody>
          </table></div>` : html`<p className="text-xs text-slate-500">장소가 2곳 이상이어야 비교할 수 있습니다.</p>`}
        </div>` : null}

        <textarea value=${report.fields[f.key]} onChange=${(e) => setField(f.key, e.target.value)} rows=${f.rows} placeholder=${f.ph} className=${`${inputCls} leading-6`} />

        ${f.images ? html`<${ImageAttachments}
          images=${report.images.filter((i) => i.section === f.images)} figNo=${figNo}
          hint=${f.images === 'process' ? '활동 사진 추가' : '차트·표 캡처 / 추가 그림 업로드'}
          onAdd=${(files) => addImages(f.images, files)} onCaption=${(id, c) => updateImg(id, { caption: c })}
          onRemove=${removeImg} onCopy=${copyImg} />` : null}
      </div>`)}
    <//>`)}
  </div>`;
}

// ===================== App =====================
function useAutoSave(enabled, key, value, onState, delay = 600) {
  useEffect(() => {
    if (!enabled) return undefined;
    onState('saving');
    const id = setTimeout(() => { DB.set(key, value).then((ok) => onState(ok ? 'saved' : 'error')); }, delay);
    return () => clearTimeout(id);
  }, [enabled, key, value, delay]);
}

function App() {
  const [ready, setReady] = useState(false);
  const [sessions, setSessions] = useState([]);
  const [cleaning, setCleaning] = useState(DEFAULT_CLEANING);
  const [anomalyCfg, setAnomalyCfg] = useState(DEFAULT_ANOMALY);
  const [report, setReport] = useState(emptyReport);
  const [cloudCfg, setCloudCfgState] = useState(CLOUD_DEFAULT);
  const [naming, setNaming] = useState(DEFAULT_NAMING);
  const [view, setView] = useState('data');
  const [tab, setTab] = useState('compare');
  const [modal, setModal] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [busy, setBusy] = useState(false);
  const [saveState, setSaveState] = useState('idle');
  const [toast, setToast] = useState(null);
  const sessionsRef = useRef(sessions);
  sessionsRef.current = sessions;

  const notify = useCallback((msg, tone = 'info') => {
    const id = Date.now() + Math.random();
    setToast({ id, msg, tone });
    setTimeout(() => setToast((t) => (t && t.id === id ? null : t)), 6000);
  }, []);

  useEffect(() => {
    (async () => {
      const [d, r, st, cc, v] = await Promise.all([DB.get('data:current'), DB.get('report:current'), DB.get('settings'), DB.get('cloud:config'), DB.get('ui:view')]);
      if (d && d.sessions) setSessions(normalizeSessions(d.sessions));
      if (r) setReport(normalizeReport(r));
      if (st) { if (st.cleaning) setCleaning(mergeCleaning(st.cleaning)); if (st.anomaly) setAnomalyCfg(mergeAnomaly(st.anomaly)); if (st.naming) setNaming(mergeNaming(st.naming)); }
      const cloudInit = { ...CLOUD_DEFAULT, ...(cc || {}) };
      if (!String(cloudInit.firebaseUrl || '').trim()) cloudInit.firebaseUrl = CLOUD_DEFAULT.firebaseUrl;
      setCloudCfgState(cloudInit);
      if (v === 'report' || v === 'data') setView(v);
      setReady(true);
      initFirebaseAnalytics();
      if (cloudInit.provider === 'firebase' && !cloudInit.fbChecked) {
        const res = await detectFirebaseUrl(cloudInit.firebaseUrl);
        if (res.status !== 'missing') {
          const next = { ...cloudInit, firebaseUrl: res.url, fbChecked: res.status === 'ok' };
          setCloudCfgState((prev) => (prev.provider === 'firebase' && prev.firebaseUrl === cloudInit.firebaseUrl ? next : prev));
          DB.set('cloud:config', next);
          if (res.status === 'locked') notify('Firebase 데이터베이스는 찾았지만 보안 규칙이 저장을 막고 있습니다. [저장/불러오기 → 클라우드 → 설정]의 규칙을 Firebase 콘솔에 게시해 주세요.', 'error');
        }
      }
    })();
  }, []);

  const dataValue = useMemo(() => ({ sessions }), [sessions]);
  const settingsValue = useMemo(() => ({ cleaning, anomaly: anomalyCfg, naming }), [cleaning, anomalyCfg, naming]);
  useAutoSave(ready, 'data:current', dataValue, setSaveState);
  useAutoSave(ready, 'report:current', report, setSaveState, 900);
  useAutoSave(ready, 'settings', settingsValue, setSaveState);
  useEffect(() => { if (ready) DB.set('ui:view', view); }, [ready, view]);
  const setCloudCfg = (c) => { setCloudCfgState(c); DB.set('cloud:config', c); };

  const allProcessed = useMemo(() => processSessions(sessions, cleaning), [sessions, cleaning]);
  const processed = useMemo(() => allProcessed.filter((s) => s.records.length > 0), [allProcessed]);
  const anomalies = useMemo(() => new Map(processed.map((s) => [s.id, detectAnomalies(s, anomalyCfg)])), [processed, anomalyCfg]);
  const anomalyCounts = useMemo(() => new Map([...anomalies].map(([id, l]) => [id, l.length])), [anomalies]);
  const summaries = useMemo(() => summarizeLocations(processed), [processed]);

  const addSessions = (list) => setSessions((prev) => {
    const ids = new Set(prev.map((s) => s.id));
    return [...prev, ...list.map((s) => (ids.has(s.id) ? { ...s, id: uid() } : s))];
  });
  const updateSession = (id, patch) => setSessions((p) => p.map((s) => (s.id === id ? { ...s, ...patch } : s)));
  const renameLocation = (from, to) => setSessions((p) => p.map((s) => (s.location === from ? { ...s, location: to } : s)));

  const reclassify = (nm) => {
    let changed = 0;
    const next = sessionsRef.current.map((s) => {
      const info = parseFileName(s.originName || s.location, nm);
      const patch = {};
      if (info.location && info.location !== '미분류' && info.location !== s.location) patch.location = info.location;
      if (info.date && info.date !== s.date) patch.date = info.date;
      if (!Object.keys(patch).length) return s;
      changed++;
      return { ...s, originName: s.originName || s.location, ...patch };
    });
    if (changed) setSessions(next);
    return changed;
  };

  const buildDataPayload = () => ({ app: APP, kind: 'data', version: 1, savedAt: new Date().toISOString(), sessions, settings: { cleaning, anomaly: anomalyCfg, naming } });
  const buildReportPayload = ({ includeData }) => ({ app: APP, kind: 'report', version: 1, savedAt: new Date().toISOString(), report, ...(includeData ? { sessions, settings: { cleaning, anomaly: anomalyCfg, naming } } : {}) });

  const applyPayload = (p, expect) => {
    if (!p || p.app !== APP) throw new Error('AirSense Analytics에서 저장한 파일이 아닙니다.');
    if (expect === 'data' && p.kind !== 'data') throw new Error('보고서 파일입니다. [보고서 대시보드 > 보고서 저장/불러오기]에서 열어 주세요.');
    if (expect === 'report' && p.kind !== 'report') throw new Error('측정 데이터 파일입니다. 상단 [데이터 저장/불러오기]에서 열어 주세요.');
    if (Array.isArray(p.sessions)) {
      const list = normalizeSessions(p.sessions);
      const replace = p.kind === 'data' || !sessionsRef.current.length
        || confirm(`이 보고서에는 측정 데이터 ${list.length}회가 함께 저장되어 있습니다.\n현재 측정 데이터를 이것으로 바꿀까요? (취소하면 현재 데이터 유지)`);
      if (replace) {
        setSessions(list);
        if (p.settings?.cleaning) setCleaning(mergeCleaning(p.settings.cleaning));
        if (p.settings?.anomaly) setAnomalyCfg(mergeAnomaly(p.settings.anomaly));
        if (p.settings?.naming) setNaming(mergeNaming(p.settings.naming));
        setSelectedId(null);
      }
    }
    if (p.report) setReport(normalizeReport(p.report));
  };

  const handleFiles = async (files) => {
    setBusy(true);
    const added = [];
    const errors = [];
    try {
      for (const file of files) {
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        try {
          if (ext === 'zip') {
            const zip = await JSZip.loadAsync(file, { decodeFileName: (bytes) => decodeText(bytes).normalize('NFC') });
            const info = parseFileName(file.name, naming);
            const zipBase = baseName(file.name.normalize('NFC')).trim();
            const entries = Object.values(zip.files)
              .filter((f) => !f.dir && /\.(csv|txt)$/i.test(f.name) && !/__MACOSX/.test(f.name) && !baseName(f.name).startsWith('.'))
              .sort((a, b) => byKo(a.name, b.name));
            if (!entries.length) { errors.push(`${file.name}: ZIP 안에 CSV 파일이 없습니다.`); continue; }
            const dirs = new Set(entries.map((e) => e.name.split('/').slice(0, -1).pop() || ''));
            const useDir = dirs.size > 1 && !dirs.has('');
            for (const en of entries) {
              try {
                const loc = useDir ? locationFromName(en.name.split('/').slice(0, -1).pop(), naming) : info.location;
                const list = csvToSessions(decodeText(await en.async('uint8array')), en.name, loc, { dateHint: info.date, naming });
                list.forEach((ss) => {
                  ss.originName = zipBase;
                  ss.label = entries.length > 1 ? `${zipBase} · ${ss.label}` : zipBase + ((ss.label.match(/ \(\d{2}:\d{2}\)$/) || [''])[0]);
                });
                added.push(...list);
              } catch (e) { errors.push(`${file.name} › ${e.message}`); }
            }
          } else if (ext === 'csv' || ext === 'txt') {
            const info = parseFileName(file.name, naming);
            const list = csvToSessions(decodeText(await file.arrayBuffer()), file.name, info.location, { dateHint: info.date, naming });
            list.forEach((ss) => { ss.originName = baseName(file.name.normalize('NFC')); });
            added.push(...list);
          } else if (ext === 'json') {
            const data = JSON.parse(await file.text());
            if (data && data.app === APP) {
              applyPayload(data);
              notify(`${file.name}을(를) 불러왔습니다.`, 'success');
            } else {
              const rows = Array.isArray(data) ? data : Array.isArray(data?.records) ? data.records : null;
              if (!rows) throw new Error(`${file.name}: 지원하지 않는 JSON 구조입니다.`);
              const recs = recordsFromObjects(rows);
              if (!recs.length) throw new Error(`${file.name}: 측정 레코드를 인식하지 못했습니다.`);
              const hint = typeof data?.location === 'string' ? stripPersonNames(data.location, naming.stripNames) : locationFromName(file.name, naming);
              for (const [l, list] of groupBy(recs, (r) => r.loc || hint)) {
                list.sort((a, b) => a.t - b.t);
                added.push(makeSession(l, list, file.name, false));
              }
            }
          } else errors.push(`${file.name}: 지원하지 않는 형식입니다.`);
        } catch (e) {
          errors.push(e.message);
        }
      }
      if (added.length) {
        addSessions(added);
        const rules = [...new Set(added.map((s) => s.colRule).filter(Boolean))];
        const ruleMsg = rules.length ? `\n열 자동 인식(B·C·D 크기 비교): ${rules.join(' / ')}` : '';
        notify(`측정 ${added.length}회 추가 · 장소: ${[...new Set(added.map((s) => s.location))].join(', ')}${ruleMsg}`, 'success');
      }
      if (errors.length) notify(errors.join('\n'), 'error');
    } finally {
      setBusy(false);
    }
  };

  const reset = async () => {
    if (!confirm('모든 측정 데이터·설정·보고서를 이 브라우저에서 삭제할까요?\n(브라우저 저장 목록과 클라우드에 저장한 내용은 남습니다)')) return;
    await Promise.all(['data:current', 'report:current', 'settings'].map((k) => DB.del(k)));
    setSessions([]);
    setCleaning(DEFAULT_CLEANING);
    setAnomalyCfg(DEFAULT_ANOMALY);
    setNaming(DEFAULT_NAMING);
    setReport(emptyReport());
    setSelectedId(null);
    notify('초기화했습니다.', 'info');
  };

  if (!ready) return html`<div className="grid min-h-screen place-items-center text-slate-400">저장된 데이터를 불러오는 중…</div>`;

  return html`<div className="min-h-screen">
    <${Navbar} view=${view} setView=${setView} sessionCount=${sessions.length} saveState=${saveState}
      onStorage=${() => setModal('dataStorage')} onCleaning=${() => setModal('cleaning')} onAnomaly=${() => setModal('anomaly')}
      onCsv=${() => downloadBlob(sessionsToCsv(processed), `airsense_정제데이터_${stamp()}.csv`, 'text/csv;charset=utf-8')}
      onReport=${() => setModal('report')} onReset=${reset} />

    ${view === 'data' ? html`<main className="mx-auto grid max-w-[1600px] gap-6 px-4 py-6 sm:px-6 lg:grid-cols-[340px_minmax(0,1fr)]">
      <aside className="space-y-4">
        <${FileUploadZone} onFiles=${handleFiles} busy=${busy} onManual=${() => setModal('manual')} naming=${naming} onNaming=${() => setModal('naming')}
          onSample=${() => { addSessions(sampleSessions()); notify('10월 서울 5개 장소 예시 데이터(11회 측정)를 추가했습니다.', 'success'); }} />
        <${ClassificationManager} processed=${allProcessed} anomalyCounts=${anomalyCounts} selectedId=${selectedId}
          onSelect=${(id) => { setSelectedId(id); setTab('session'); }} onUpdate=${updateSession} onRename=${renameLocation}
          onRemove=${(id) => setSessions((p) => p.filter((s) => s.id !== id))}
          onRemoveLocation=${(l) => setSessions((p) => p.filter((s) => s.location !== l))} />
      </aside>
      <section className="min-w-0 space-y-4">
        <div className="flex rounded-lg border border-slate-800 bg-slate-900 p-1 text-sm sm:w-fit">
          ${[['compare', '모드 1 · 장소별 / 날짜별 비교', 'GitCompareArrows'], ['session', '모드 2 · 측정 회차 상세 & 이상치', 'Activity']].map(([id, l, ic]) => html`<button key=${id} type="button" onClick=${() => setTab(id)}
            className=${`flex flex-1 items-center justify-center gap-1.5 rounded-md px-3 py-1.5 ${tab === id ? 'bg-cyan-500/15 text-cyan-300' : 'text-slate-400 hover:text-slate-200'}`}><${Icon} name=${ic} />${l}</button>`)}
        </div>
        ${tab === 'compare'
          ? html`<${CompareDashboard} processed=${processed} summaries=${summaries} />`
          : html`<${SessionDetail} processed=${processed} anomalies=${anomalies} selectedId=${selectedId} onSelect=${setSelectedId} cfg=${anomalyCfg} />`}
      </section>
    </main>` : html`<main className="px-4 py-6 sm:px-6">
      <${InquiryReportView} processed=${processed} summaries=${summaries} anomalies=${anomalies} cfg=${anomalyCfg}
        report=${report} setReport=${setReport} notify=${notify} onOpenStorage=${() => setModal('reportStorage')} />
    </main>`}

    ${modal === 'cleaning' ? html`<${DataCleaningModal} options=${cleaning} sessions=${sessions} onClose=${() => setModal(null)}
      onApply=${(o) => { setCleaning(o); setModal(null); notify('정제 설정을 적용했습니다.', 'success'); }} />` : null}
    ${modal === 'anomaly' ? html`<${AnomalySettingsModal} settings=${anomalyCfg} processed=${processed} onClose=${() => setModal(null)}
      onApply=${(a) => { setAnomalyCfg(a); setModal(null); notify('이상치 탐지 설정을 적용했습니다.', 'success'); }} />` : null}
    ${modal === 'report' ? html`<${ReportModal} processed=${processed} summaries=${summaries} anomalies=${anomalies} cfg=${anomalyCfg} onClose=${() => setModal(null)} />` : null}
    ${modal === 'naming' ? html`<${NamingSettingsModal} naming=${naming} sessions=${sessions} onClose=${() => setModal(null)}
      onApply=${(n, redo) => {
        setNaming(n);
        setModal(null);
        const c = redo ? reclassify(n) : 0;
        notify(`장소명에서 뺄 이름: ${n.stripNames.length ? n.stripNames.join(', ') : '없음'}${redo ? ` · 기존 측정 ${c}회 다시 분류` : ''}`, 'success');
      }} />` : null}
    ${modal === 'manual' ? html`<${ManualEntryModal} locations=${summaries.map((s) => s.location)} onClose=${() => setModal(null)}
      onAdd=${(list) => { addSessions(list); setModal(null); notify('측정값을 추가했습니다.', 'success'); }} />` : null}
    ${modal === 'dataStorage' ? html`<${StorageModal} kind="data" onClose=${() => setModal(null)} buildPayload=${buildDataPayload} applyPayload=${applyPayload}
      cloudCfg=${cloudCfg} setCloudCfg=${setCloudCfg} notify=${notify} />` : null}
    ${modal === 'reportStorage' ? html`<${StorageModal} kind="report" onClose=${() => setModal(null)} buildPayload=${buildReportPayload} applyPayload=${applyPayload}
      cloudCfg=${cloudCfg} setCloudCfg=${setCloudCfg} notify=${notify} />` : null}

    ${toast ? html`<div role="status" className=${`fixed bottom-5 right-5 z-[60] max-w-md whitespace-pre-line rounded-lg border px-4 py-3 text-sm ${toast.tone === 'error' ? 'border-rose-500/40 bg-rose-950 text-rose-200' : toast.tone === 'success' ? 'border-emerald-500/40 bg-emerald-950 text-emerald-200' : 'border-slate-700 bg-slate-900 text-slate-200'}`}>
      ${toast.msg}
      <button type="button" onClick=${() => setToast(null)} className="ml-3 text-xs opacity-60 hover:opacity-100">닫기</button>
    </div>` : null}
  </div>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>
</body>
</html>
